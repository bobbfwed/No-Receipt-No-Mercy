<rect x="104" y="236" width="1072" height="104" rx="8" fill="#fff" stroke="#9aa" stroke-width="2"/>
<use href="#badge" x="118" y="238"/>
<circle cx="158" cy="286" r="20" fill="#e0b088" stroke="#222" stroke-width="3"/><rect x="138" y="262" width="40" height="10" rx="3" fill="#222"/>
<path d="M149 280L156 284M167 280L160 284" stroke="#222" stroke-width="2.5"/><circle cx="151" cy="287" r="2.5" fill="#222"/><circle cx="165" cy="287" r="2.5" fill="#222"/><path d="M150 297Q158 292 166 297" stroke="#222" stroke-width="2.5" fill="none"/>
<rect x="132" y="318" width="52" height="12" rx="3" fill="#ff7a1a" stroke="#222" stroke-width="2"/>
<text x="222" y="274" font-size="26" font-weight="700" fill="#222">Steve</text>
<text x="222" y="300" font-size="15" fill="#555">Loss Prevention</text>
<rect x="222" y="312" width="22" height="14" rx="4" fill="#ff7a1a" stroke="#222" stroke-width="2"/>
<g font-size="15" fill="#222">
<text x="350" y="262">Goods shipped</text><rect x="500" y="248" width="190" height="16" rx="8" fill="#ddd" stroke="#222" stroke-width="2"/><rect x="502" y="250" width="30" height="12" rx="6" fill="#3aa655"/><text x="700" y="262" font-weight="700">64</text>
<text x="350" y="291">Shoppers stopped</text><rect x="500" y="277" width="190" height="16" rx="8" fill="#ddd" stroke="#222" stroke-width="2"/><rect x="502" y="279" width="170" height="12" rx="6" fill="#2f7fbf"/><text x="700" y="291" font-weight="700">131</text>
<text x="350" y="320">Cash wasted</text><rect x="500" y="306" width="190" height="16" rx="8" fill="#ddd" stroke="#222" stroke-width="2"/><rect x="502" y="308" width="90" height="12" rx="6" fill="#d9372b"/><text x="700" y="320" font-weight="700">$890</text>
</g>
<g transform="translate(985 288) rotate(5)"><use href="#stamp"/><text y="11" font-size="30" font-weight="700" font-family="Impact, Arial Black, sans-serif" fill="#c4271c" text-anchor="middle">LIABILITY</text></g>

<!-- Row 3 -->
<rect x="104" y="352" width="1072" height="104" rx="8" fill="#fff" stroke="#9aa" stroke-width="2"/>
<use href="#badge" x="118" y="354"/>
<circle cx="158" cy="402" r="20" fill="#f2c9a0" stroke="#222" stroke-width="3"/><path d="M140 396Q148 384 158 392Q168 384 176 396" fill="#c9a227" stroke="#222" stroke-width="2"/>
<circle cx="151" cy="403" r="3.5" fill="#fff" stroke="#222" stroke-width="1.5"/><circle cx="165" cy="403" r="3.5" fill="#fff" stroke="#222" stroke-width="1.5"/><circle cx="152" cy="404" r="1.5" fill="#222"/><circle cx="164" cy="404" r="1.5" fill="#222"/><ellipse cx="158" cy="413" rx="4" ry="3" fill="#7a1010" stroke="#222" stroke-width="1.5"/>
<rect x="132" y="434" width="52" height="12" rx="3" fill="#4cd964" stroke="#222" stroke-width="2"/>
<text x="222" y="390" font-size="26" font-weight="700" fill="#222">Kev</text>
<text x="222" y="416" font-size="15" fill="#555">Purchasing</text>
<rect x="222" y="428" width="22" height="14" rx="4" fill="#4cd964" stroke="#222" stroke-width="2"/>
<g font-size="15" fill="#222">
<text x="350" y="378">Goods shipped</text><rect x="500" y="364" width="190" height="16" rx="8" fill="#ddd" stroke="#222" stroke-width="2"/><rect x="502" y="366" width="12" height="12" rx="6" fill="#3aa655"/><text x="700" y="378" font-weight="700">9</text>
<text x="350" y="407">Shoppers stopped</text><rect x="500" y="393" width="190" height="16" rx="8" fill="#ddd" stroke="#222" stroke-width="2"/><rect x="502" y="395" width="16" height="12" rx="6" fill="#2f7fbf"/><text x="700" y="407" font-weight="700">3</text>
<text x="350" y="436">Cash wasted</text><rect x="500" y="422" width="190" height="16" rx="8" fill="#ddd" stroke="#222" stroke-width="2"/><rect x="502" y="424" width="184" height="12" rx="6" fill="#d9372b"/><text x="700" y="436" font-weight="700">$2,340</text>
</g>
<g transform="translate(985 404) rotate(-4)"><use href="#stamp"/><text y="10" font-size="28" font-weight="700" font-family="Impact, Arial Black, sans-serif" fill="#c4271c" text-anchor="middle">WHY IS HE HERE</text></g>

<!-- Employee of the wave -->
<rect x="104" y="470" width="340" height="124" rx="8" fill="#fff8d6" stroke="#b8860b" stroke-width="3"/>
<text x="274" y="494" font-size="17" font-weight="700" fill="#7a5a00" text-anchor="middle">EMPLOYEE OF THE WAVE</text>
<rect x="122" y="506" width="78" height="74" fill="#fff" stroke="#8a5a1e" stroke-width="7"/><rect x="132" y="516" width="58" height="54" fill="#eee" stroke="#bbb" stroke-width="2"/>
<path d="M132 516L190 570M190 516L132 570" stroke="#ddd" stroke-width="2"/>
<text x="218" y="553" font-size="30" font-weight="700" fill="#555">Nobody</text>

<!-- DEB comment -->
<rect x="460" y="470" width="716" height="124" rx="8" fill="#e8f2fa" stroke="#2f7fbf" stroke-width="3"/>
<text x="560" y="494" font-size="15" font-weight="700" fill="#2f7fbf">DEB (HR) COMMENTS</text>
<g transform="translate(474 500)">
<line x1="30" y1="0" x2="30" y2="8" stroke="#222" stroke-width="3"/><circle cx="30" cy="0" r="4" fill="#d9372b" stroke="#222" stroke-width="2"/>
<rect x="4" y="8" width="52" height="44" rx="12" fill="#cfd8dc" stroke="#222" stroke-width="3"/>
<circle cx="19" cy="26" r="7" fill="#fff" stroke="#222" stroke-width="2.5"/><circle cx="41" cy="26" r="7" fill="#fff" stroke="#222" stroke-width="2.5"/>
<circle cx="20" cy="27" r="3" fill="#222"/><circle cx="42" cy="27" r="3" fill="#222"/><path d="M16 42H44" stroke="#222" stroke-width="3" stroke-linecap="round"/>
<path d="M2 24V36M58 24V36" stroke="#222" stroke-width="5"/>
</g>
<rect x="548" y="502" width="614" height="80" rx="12" fill="#fff" stroke="#222" stroke-width="3"/>
<path d="M548 530L534 540L548 548Z" fill="#fff" stroke="#222" stroke-width="3" stroke-linejoin="round"/><rect x="545" y="531" width="6" height="16" fill="#fff"/>
<text font-size="20" fill="#222"><tspan x="566" y="534">Reminder: the stockroom is not for crying.</tspan><tspan x="566" y="564">Or the other thing. We have cameras, Mike.</tspan></text>

<!-- bottom -->
<rect x="104" y="610" width="430" height="76" rx="14" fill="#3aa655" stroke="#222" stroke-width="4"/>
<rect x="110" y="616" width="418" height="30" rx="10" fill="#fff" fill-opacity=".2"/>
<text x="319" y="660" font-size="34" font-weight="700" fill="#fff" text-anchor="middle" stroke="#1d5a2e" stroke-width="1">CLOCK BACK IN</text>
<rect x="560" y="618" width="616" height="60" rx="10" fill="#1b1f24" stroke="#f2c21b" stroke-width="3"/>
<circle cx="596" cy="648" r="16" fill="#fff" stroke="#f2c21b" stroke-width="3"/><path d="M596 638V648L604 652" stroke="#222" stroke-width="3" fill="none"/>
<text x="628" y="657" font-size="24" font-weight="700" fill="#fff">Next sales event in <tspan fill="#f2c21b">0:23</tspan></text>
<rect x="960" y="638" width="196" height="20" rx="10" fill="#111" stroke="#fff" stroke-width="1.5"/><rect x="962" y="640" width="30" height="16" rx="8" fill="#f2c21b"/>
</svg>
