<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Segoe UI, Arial, sans-serif">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#8b8e91"/><path d="M0 0H40M0 0V40" stroke="#6f7275" stroke-width="2" fill="none"/></pattern>
<pattern id="beltH" width="24" height="30" patternUnits="userSpaceOnUse"><rect width="24" height="30" fill="#3b3f44"/><path d="M4 4L14 15L4 26" stroke="#f2c21b" stroke-width="4" fill="none"/></pattern>
<pattern id="haz" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="16" height="16" fill="#f2c21b"/><rect width="8" height="16" fill="#222"/></pattern>
<pattern id="ruled" width="10" height="28" patternUnits="userSpaceOnUse"><rect width="10" height="28" fill="#f6f2e4"/></pattern>
<filter id="sh" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity=".5"/></filter>
<g id="badge">
<rect x="30" y="-10" width="20" height="16" rx="3" fill="#888" stroke="#222" stroke-width="2"/>
<rect x="0" y="4" width="80" height="98" rx="8" fill="#fff" stroke="#222" stroke-width="3"/>
<rect x="0" y="4" width="80" height="16" rx="6" fill="#2f7fbf" stroke="#222" stroke-width="3"/>
<rect x="10" y="86" width="60" height="8" rx="2" fill="#ccc"/>
</g>
<g id="stamp"><rect x="-148" y="-30" width="296" height="60" rx="6" fill="none" stroke="#c4271c" stroke-width="6"/><rect x="-140" y="-22" width="280" height="44" rx="3" fill="none" stroke="#c4271c" stroke-width="2"/></g>
</defs>
<!-- dimmed warehouse -->
<rect width="1280" height="720" fill="url(#grid)"/>
<rect x="0" y="80" width="1280" height="30" fill="url(#beltH)"/><rect x="0" y="600" width="1280" height="30" fill="url(#beltH)"/>
<rect x="60" y="300" width="130" height="90" fill="#e8761a" stroke="#222" stroke-width="4"/><rect x="1090" y="300" width="130" height="90" fill="#2f7fbf" stroke="#222" stroke-width="4"/>
<rect width="1280" height="720" fill="#0b0d10" fill-opacity=".72"/>

<!-- paper form -->
<rect x="90" y="20" width="1100" height="682" rx="12" fill="#f6f2e4" stroke="#222" stroke-width="4" filter="url(#sh)"/>
<rect x="90" y="20" width="1100" height="64" rx="12" fill="#2f4a63" stroke="#222" stroke-width="4"/>
<rect x="90" y="60" width="1100" height="24" fill="#2f4a63"/>
<text x="640" y="63" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">PERFORMANCE REVIEW - SALES EVENT 7</text>
<text x="230" y="110" font-size="13" fill="#6a6a6a" font-style="italic">Form HR-7B. Please do not fold, staple, or cry on this document.</text>

<!-- rows -->
<g>
<rect x="104" y="120" width="1072" height="104" rx="8" fill="#fff" stroke="#9aa" stroke-width="2"/>
</g>

<!-- Row 1 -->
<g transform="translate(0 0)">
<use href="#badge" x="118" y="122" transform="translate(0 -4)"/>
<circle cx="158" cy="170" r="20" fill="#f2c9a0" stroke="#222" stroke-width="3"/><path d="M142 166Q158 150 174 166" fill="#5a3b1e" stroke="#222" stroke-width="2"/>
<circle cx="151" cy="171" r="2.5" fill="#222"/><circle cx="165" cy="171" r="2.5" fill="#222"/><path d="M150 180Q158 184 166 180" stroke="#222" stroke-width="2.5" fill="none"/>
<rect x="132" y="202" width="52" height="12" rx="3" fill="#3ba3ff" stroke="#222" stroke-width="2"/>
</g>
<text x="222" y="158" font-size="26" font-weight="700" fill="#222">Dave</text>
<text x="222" y="184" font-size="15" fill="#555">Floor Manager</text>
<rect x="222" y="196" width="22" height="14" rx="4" fill="#3ba3ff" stroke="#222" stroke-width="2"/>

<!-- stats row 1 -->
<g font-size="15" fill="#222">
<text x="350" y="146">Goods shipped</text><rect x="500" y="132" width="190" height="16" rx="8" fill="#ddd" stroke="#222" stroke-width="2"/><rect x="502" y="134" width="150" height="12" rx="6" fill="#3aa655"/><text x="700" y="146" font-weight="700">412</text>
<text x="350" y="175">Shoppers stopped</text><rect x="500" y="161" width="190" height="16" rx="8" fill="#ddd" stroke="#222" stroke-width="2"/><rect x="502" y="163" width="80" height="12" rx="6" fill="#2f7fbf"/><text x="700" y="175" font-weight="700">58</text>
<text x="350" y="204">Cash wasted</text><rect x="500" y="190" width="190" height="16" rx="8" fill="#ddd" stroke="#222" stroke-width="2"/><rect x="502" y="192" width="45" height="12" rx="6" fill="#d9372b"/><text x="700" y="204" font-weight="700">$310</text>
</g>
<g transform="translate(985 172) rotate(-6)"><use href="#stamp"/><text y="11" font-size="30" font-weight="700" font-family="Impact, Arial Black, sans-serif" fill="#c4271c" text-anchor="middle">ADEQUATE</text></g>

