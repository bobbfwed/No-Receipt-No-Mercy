<path d="M336 136H920" stroke="#3ddc9a" stroke-dasharray="6 5"/>
<text x="336" y="170">Ore sold</text><text x="920" y="170" text-anchor="end" fill="#5dffb5">+18,400</text>
<text x="336" y="204">Rare crystal sold</text><text x="920" y="204" text-anchor="end" fill="#5dffb5">+9,600</text>
<text x="336" y="238">Turret ammo</text><text x="920" y="238" text-anchor="end" fill="#ff9a7a">-2,100</text>
<text x="336" y="272" font-size="15">Rover repairs (Steve drove into a crater.</text>
<text x="336" y="292" font-size="15">Again.)</text><text x="920" y="292" text-anchor="end" fill="#ff9a7a">-3,300</text>
