<text x="340" y="338" font-weight="bold" fill="#ffffff">ALIMONY (40%)</text><text x="918" y="338" text-anchor="end" font-weight="bold" font-size="22" fill="#ff6b6b">-11,200</text>
<text x="336" y="378">Emotional damages</text><text x="920" y="378" text-anchor="end" fill="#ff9a7a">-500</text>
<path d="M336 396H920" stroke="#3ddc9a" stroke-width="3"/>
<text x="336" y="438" font-size="26" font-weight="bold" fill="#ffffff">NET</text><text x="920" y="438" text-anchor="end" font-size="30" font-weight="bold" fill="#5dffb5">+10,900</text>
<text x="336" y="480" font-size="14" fill="#7fb8a4">Statement generated by K.A.R.E.N. All decisions final.</text>
<text x="336" y="500" font-size="14" fill="#7fb8a4">Disputes may be filed in a drawer.</text>
</g>
