<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Touch check (test page)</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
  /* Over the whole page once there is a lot to list, so every check is in the picture. */
  #log { position: fixed; left: 2px; right: 2px; bottom: 2px; z-index: 9; max-height: calc(100% - 4px); overflow: auto; background: #000d; color: #9f9; font: 8.6px/1.17 Consolas, monospace; padding: 3px 5px; white-space: pre-wrap; pointer-events: none; }
  #log .bad { color: #f88; }
</style>
</head>
<body>
<!--
  A test page: plays a solo game with made-up touch events (pointer events of type 'touch', the
  same a phone sends) and checks the touch rules in src/ui/input.js and src/ui/touch.js:
    one finger with nothing held moves the view and builds nothing; two fingers move and zoom the
    view and never build, even with a building held, even when the second finger lands late;
    a tap builds; a drag with any building but the belt builds nothing while the finger is down,
    the preview follows the finger, and one building is placed on the tile it lifts from (none on
    an occupied tile, none when lifted over a button); the Rotate button and the "another finger
    cancels" hint show while a finger is placing, away from the finger, and go when it lifts; a
    tap on that Rotate button turns the building without cancelling; a second finger on the floor
    cancels a placement and then pinches; a belt drag lays a line facing the way it was dragged,
    and a second finger stops it where it is; the bar's rotate button turns what is held, and a
    tapped building; tapping a building opens its sheet, whose buttons upgrade and remove; the
    Upgrade tool opens the sheet of the building the finger lifts from; the Remove tool removes
    exactly one building, where the finger lifts, by tap or drag (a bigger one tapped off its
    top-left tile too) without an error banner; tapping the held tool's button again puts it down,
    as does the put-down button; the map and home buttons move the view.
  0.3.03 (the owner's requests): once a finger with a building held drags, the preview rides above
    it and the building goes there, not under the finger; a finger that does not drag places on the
    tapped tile however long it rests, and one that drags and comes back stays lifted; a building
    dragged up out of its bar button follows the finger lifted and lifting places exactly one (a
    Barcode Laser and a TV Salesman centred on the lifted point, the belt one belt), with what was
    held before held again after; a sideways swipe on the bar places nothing; a second finger
    cancels a bar drag; a preview lifted off the floor places nothing; a pointercancel leaves nothing
    held or previewed; a finger held at an edge of the floor slides the view slowly and it stops
    when the finger leaves the edge or lifts (the bottom edge only once a bar drag has been up on
    the floor).
  Open it at phone size with touch emulation, and read the results from the page:
    node tools/realshot.mjs "http://localhost:5173/tools/touch-test.html" out.png 40000 390 844 --touch --dpr=2 --eval=__result
  __result is "PASS n/n" or "FAIL ..." once done; each check is also listed on the picture.
-->
<iframe id="game" src="../index.html?solo=1&name=Thumbs&seed=3&size=xs" title="Game"></iframe>
<div id="log"></div>
<script type="module">
  import { canPlace, statsOf } from '../src/sim/index.js';
  import { selectedReach } from '../src/render/reach.js';
  import { LIFT, EDGE, liftPx } from '../src/ui/lift.js';
  const frame = document.getElementById('game');
  const logEl = document.getElementById('log');
  const results = [];
  const log = (t, bad) => { const d = document.createElement('div'); d.textContent = t; if (bad) d.className = 'bad'; logEl.append(d); };
  const check = (name, ok, detail = '') => { results.push({ name: detail ? `${name} (${detail})` : name, ok }); log(`${ok ? 'PASS' : 'FAIL'} ${name}${detail ? ` (${detail})` : ''}`, !ok); };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  window.__result = 'running';

  frame.addEventListener('load', async () => {
    try { await run(); } catch (err) { check(`no errors: ${err && err.message}`, false); }
    const bad = results.filter((r) => !r.ok);
    window.__result = bad.length ? `FAIL ${bad.length}/${results.length}: ${bad.map((r) => r.name).join('; ')}` : `PASS ${results.length}/${results.length}`;
    log(window.__result, bad.length > 0);
  });

  async function run() {
    const win = frame.contentWindow, doc = frame.contentDocument;
    for (let i = 0; i < 50 && !win.__game; i++) await wait(100);
    await wait(400);
    const { session, renderer, input } = win.__game;
    const s = () => session.state;
    const canvas = doc.querySelector('canvas.world');
    const me = session.me;
    let nopes = 0;
    session.on('nope', () => { nopes++; });
    const at = (tx, ty) => {
      const r = canvas.getBoundingClientRect();
      const cam = renderer.cam;
      return { x: r.left + r.width / 2 + (tx + 0.5 - cam.x) * cam.zoom, y: r.top + r.height / 2 + (ty + 0.5 - cam.y) * cam.zoom };
    };
    // Where a finger goes for a lifted preview (0.3.03) to be centred on a w x h footprint whose
    // top-left tile is (tx, ty): below it by the lift.
    const liftNow = () => liftPx(renderer.cam.zoom);
    const under = (tx, ty, w = 1, h = 1) => { const c = at(tx + (w - 1) / 2, ty + (h - 1) / 2); return { x: c.x, y: c.y + liftNow() }; };
    const count = () => s().grid.filter(Boolean).length;
    const b = (x, y) => s().grid[y * s().w + x];
    const fire = (type, id, x, y) => canvas.dispatchEvent(new win.PointerEvent(type, {
      pointerType: 'touch', pointerId: id, isPrimary: id === 11, clientX: x, clientY: y,
      button: type === 'pointermove' ? -1 : 0, buttons: type === 'pointerup' || type === 'pointercancel' ? 0 : 1,
      bubbles: true, cancelable: true, width: 20, height: 20,
    }));
    /** Moves a finger that is down from a to z in small steps, like a real finger. */
    async function slide(id, a, z) {
      const n = Math.max(1, Math.ceil(Math.hypot(z.x - a.x, z.y - a.y) / 8));
      for (let k = 1; k <= n; k++) { fire('pointermove', id, a.x + ((z.x - a.x) * k) / n, a.y + ((z.y - a.y) * k) / n); await wait(4); }
    }
    /** One finger along a path of screen points. */
    async function finger(points, id = 11, hold = 0) {
      fire('pointerdown', id, points[0].x, points[0].y);
      for (let i = 1; i < points.length; i++) await slide(id, points[i - 1], points[i]);
      const e = points[points.length - 1];
      if (hold) await wait(hold); // (a lifted preview eases up before the finger lifts)
      fire('pointerup', id, e.x, e.y);
      await wait(30);
    }
    const tap = (p) => finger([p]);
    /** Two fingers: from a pair of points to another pair; `late` holds the second one back. */
    async function twoFingers(from, to, { late = 0, steps = 12 } = {}) {
      fire('pointerdown', 11, from[0].x, from[0].y);
      if (late) {
        await wait(late);
        fire('pointermove', 11, from[0].x + 3, from[0].y + 2); // a finger is never quite still
      }
      fire('pointerdown', 12, from[1].x, from[1].y);
      for (let k = 1; k <= steps; k++) {
        const f = k / steps;
        fire('pointermove', 11, from[0].x + (to[0].x - from[0].x) * f, from[0].y + (to[0].y - from[0].y) * f);
        fire('pointermove', 12, from[1].x + (to[1].x - from[1].x) * f, from[1].y + (to[1].y - from[1].y) * f);
        await wait(8);
      }
      fire('pointerup', 12, to[1].x, to[1].y);
      fire('pointerup', 11, to[0].x, to[0].y);
      await wait(30);
    }
    const barBtn = (k) => doc.querySelector(`.bb-btn[data-k="${k}"]`);
    const click = (el) => {
      el.dispatchEvent(new win.PointerEvent('pointerdown', { pointerType: 'touch', bubbles: true }));
      el.dispatchEvent(new win.PointerEvent('pointerup', { pointerType: 'touch', bubbles: true }));
      el.click();
    };
    // Picking a tool can change the build bar's height and so the floor's size; the floor is
    // measured again on the next frame, which no real finger is quick enough to beat.
    const pick = async (k) => { click(barBtn(k)); await wait(300); };
    // The placing aid (touch.js): drawn once a frame, so give it one before looking.
    const aid = () => doc.querySelector('.place-aid');
    const turnBtn = () => doc.querySelector('.place-aid .tc-turn');
    const shown = (el) => !!el && win.getComputedStyle(el).display !== 'none' && el.getClientRects().length > 0;
    const frameWait = () => wait(60);

    // A tile counts as on screen only if the floor itself is there, not a panel or button over it
    // (a finger lifted over a panel places nothing).
    const onFloor = (x, y) => { const p = at(x, y); return doc.elementFromPoint(p.x, p.y) === canvas; };
    /** Free tiles on screen, away from the edges of the view. */
    function freeTiles(kind, n, near, d = 0) {
      const r = renderer.viewRect();
      const out = [];
      let floor = 0, free = 0;
      for (let y = Math.ceil(r.y0) + 2; y < Math.floor(r.y1) - 2 && out.length < n; y++) {
        for (let x = Math.ceil(r.x0) + 2; x < Math.floor(r.x1) - 2 && out.length < n; x++) {
          if (near && (Math.abs(x - near.x) > 6 || Math.abs(y - near.y) > 6)) continue;
          if (onFloor(x, y)) floor++; else continue;
          if (!b(x, y) && canPlace(s(), kind, x, y, me, d) === null) { free++; out.push({ x, y }); }
        }
      }
      if (!out.length) throw new Error(`no free tile for ${kind} (view ${[r.x0, r.y0, r.x1, r.y1].map((v) => v.toFixed(1))}, ${floor} on the floor)`);
      return out;
    }
    /** A straight run of `len` free tiles going east. */
    function freeRun(kind, len) {
      const r = renderer.viewRect();
      // (Not the row beside the top wall: a run of belts there can cover the front of a shopper
      // entrance, and the rules rightly refuse the belt that would wall it in.)
      for (let y = Math.max(3, Math.ceil(r.y0) + 2); y < Math.floor(r.y1) - 2; y++) {
        for (let x = Math.max(3, Math.ceil(r.x0) + 1); x + len < Math.floor(r.x1) - 1; x++) {
          let ok = true;
          for (let i = 0; i < len && ok; i++) ok = canPlace(s(), kind, x + i, y, me) === null && !b(x + i, y) && onFloor(x + i, y);
          if (ok) return { x, y };
        }
      }
      return null;
    }

    check('coarse pointer media query matches', win.matchMedia('(pointer: coarse)').matches);
    check('touch buttons are shown', win.getComputedStyle(doc.querySelector('.touch-pad')).display !== 'none' && win.getComputedStyle(doc.querySelector('.bb-touch')).display !== 'none');
    check('the placing aid is hidden while nobody is placing', !shown(aid()));

    // 1. One finger, nothing held: moves the view, builds nothing.
    let n0 = count();
    renderer.zoomBy(1.5); // a tablet shows the whole small map, and a whole map cannot be dragged
    let cam0 = { ...renderer.cam };
    const mid = { x: canvas.getBoundingClientRect().left + canvas.clientWidth / 2, y: canvas.getBoundingClientRect().top + canvas.clientHeight / 2 };
    await finger([mid, { x: mid.x - 120, y: mid.y - 60 }]);
    let moved = renderer.cam.x - cam0.x;
    check('one finger with nothing held drags the view', Math.abs(moved - 120 / cam0.zoom) < 0.6 || renderer.cam.y !== cam0.y, `view moved ${moved.toFixed(2)} tiles`);
    check('... and builds nothing', count() === n0);

    // 2. Pinch with nothing held: zooms (as far as the closest zoom, 72 pixels a tile).
    cam0 = { ...renderer.cam };
    await twoFingers([{ x: mid.x - 40, y: mid.y }, { x: mid.x + 40, y: mid.y }], [{ x: mid.x - 90, y: mid.y }, { x: mid.x + 90, y: mid.y }]);
    check('two fingers spreading zoom in', renderer.cam.zoom > Math.min(cam0.zoom * 1.3, 71.9), `${cam0.zoom.toFixed(1)} -> ${renderer.cam.zoom.toFixed(1)} px a tile`);
    cam0 = { ...renderer.cam };
    await twoFingers([{ x: mid.x - 90, y: mid.y }, { x: mid.x + 90, y: mid.y }], [{ x: mid.x - 45, y: mid.y }, { x: mid.x + 45, y: mid.y }]);
    check('two fingers pinching zoom out', renderer.cam.zoom < cam0.zoom * 0.8, `${cam0.zoom.toFixed(1)} -> ${renderer.cam.zoom.toFixed(1)} px a tile`);

    // 3. Two fingers with a building held: never build, and move the view.
    await pick('crate');
    check('tapping a bar button picks the tool', input.tool === 'crate');
    n0 = count();
    renderer.zoomBy(2); // the pinch out may have reached the whole map, which cannot be dragged
    cam0 = { ...renderer.cam };
    await twoFingers([{ x: mid.x - 50, y: mid.y }, { x: mid.x + 50, y: mid.y }], [{ x: mid.x - 130, y: mid.y }, { x: mid.x - 30, y: mid.y }]);
    check('two fingers with a building held build nothing', count() === n0);
    check('... and drag the view', Math.abs(renderer.cam.x - cam0.x) > 1, `view moved ${(renderer.cam.x - cam0.x).toFixed(2)} tiles`);
    n0 = count();
    await twoFingers([{ x: mid.x - 60, y: mid.y }, { x: mid.x + 60, y: mid.y }], [{ x: mid.x - 100, y: mid.y }, { x: mid.x + 100, y: mid.y }], { late: 70 });
    check('a second finger landing 70 ms late still builds nothing', count() === n0);

    // 4. A tap builds.
    renderer.fit(); input.goHome();
    await wait(50);
    const [c1] = freeTiles('crate', 1);
    n0 = count();
    await tap(at(c1.x, c1.y));
    check('a tap with a crate held places it', b(c1.x, c1.y)?.k === 'crate', `at ${c1.x},${c1.y}`);
    check('... and only it', count() === n0 + 1);

    // 5. Tapping the held tool's button again puts it down.
    await pick('crate');
    check('tapping the held tool again puts it down', input.tool === null);

    // 6. A drag lays a belt line facing the way it was dragged.
    await pick('belt');
    const run5 = freeRun('belt', 5);
    await finger([at(run5.x, run5.y), at(run5.x + 4, run5.y)]);
    const line = [0, 1, 2, 3, 4].map((i) => b(run5.x + i, run5.y));
    check('a one-finger drag lays a line of 5 belts', line.every((t) => t && t.k === 'belt'), `from ${run5.x},${run5.y}`);
    check('... all facing east, the way it was dragged', line.every((t) => t && t.d === 0), line.map((t) => (t ? t.d : '-')).join(''));

    // 6b. A second finger during a belt drag stops the line where it is: what is laid stays, the
    // belt still under the finger is not laid, and nothing more is laid while the fingers pinch.
    const run4 = freeRun('belt', 6);
    n0 = count();
    fire('pointerdown', 11, at(run4.x, run4.y).x, at(run4.x, run4.y).y);
    await slide(11, at(run4.x, run4.y), at(run4.x + 2, run4.y));
    await frameWait();
    check('the cancel hint shows during a belt drag too', shown(aid()) && /another finger/.test(aid().textContent));
    const laid = [0, 1, 2].map((i) => b(run4.x + i, run4.y)?.k || '-').join(',');
    const pinchFrom = at(run4.x + 2, run4.y + 3);
    fire('pointerdown', 12, pinchFrom.x, pinchFrom.y);
    await slide(11, at(run4.x + 2, run4.y), at(run4.x + 5, run4.y));
    await slide(12, pinchFrom, { x: pinchFrom.x + 30, y: pinchFrom.y + 40 });
    fire('pointerup', 12, pinchFrom.x + 30, pinchFrom.y + 40);
    fire('pointerup', 11, at(run4.x + 5, run4.y).x, at(run4.x + 5, run4.y).y);
    await wait(40);
    check('a second finger stops a belt line: the two already laid stay, nothing more is laid',
      laid === 'belt,belt,-' && count() === n0 + 2 && !b(run4.x + 2, run4.y) && !b(run4.x + 3, run4.y), `laid ${laid}; ${count() - n0} new`);
    check('... and the belt stays picked', input.tool === 'belt');
    renderer.fit(); input.goHome(); // (the pinch moved the view)
    await wait(80);

    // 7. The bar's rotate button turns what is held.
    const d0 = input.dir;
    click(doc.querySelector('.tc-rotate'));
    check('the rotate button turns the held building', input.dir === ((d0 + 1) & 3));
    const [c2] = freeTiles('belt', 1);
    await tap(at(c2.x, c2.y));
    check('a single tap places one belt facing the turned way', b(c2.x, c2.y)?.k === 'belt' && b(c2.x, c2.y).d === input.dir, `d=${b(c2.x, c2.y)?.d}`);

    // 8. The put-down button.
    click(doc.querySelector('.tc-drop'));
    check('the put-down button drops the tool', input.tool === null);

    // 9. Tap a building with nothing held: its sheet; rotate and remove from it.
    await tap(at(run5.x + 2, run5.y));
    await wait(80);
    const sheet = doc.querySelector('.touch-sheet');
    check('tapping a building with nothing held selects it', input.selected && input.selected.x === run5.x + 2);
    check('... and opens its sheet', !sheet.classList.contains('hidden'));
    const dB = b(run5.x + 2, run5.y).d;
    click(doc.querySelector('.tc-rotate'));
    check('the rotate button turns the tapped building', b(run5.x + 2, run5.y).d === ((dB + 1) & 3));
    const sheetRot = [...sheet.querySelectorAll('.ts-btn')].find((x) => x.textContent.includes('Rotate'));
    click(sheetRot);
    check("the sheet's Rotate button turns it too", b(run5.x + 2, run5.y).d === ((dB + 2) & 3));
    n0 = count();
    click(sheet.querySelector('.ts-remove'));
    await wait(80);
    check("the sheet's Remove button removes it", !b(run5.x + 2, run5.y) && count() === n0 - 1);
    check('... and the sheet closes', sheet.classList.contains('hidden'));
    // (Chosen before the sheet opens: on a phone the sheet and DEB above it cover most of the
    // floor at this zoom.)
    const empty = freeTiles('crate', 1)[0];
    await tap(at(c1.x, c1.y));
    await wait(30);
    const cam1 = { ...renderer.cam };
    await tap(at(empty.x, empty.y));
    await wait(80);
    check('tapping empty floor closes the sheet', sheet.classList.contains('hidden') && !input.selected);
    check('... and a tap does not move the view', renderer.cam.x === cam1.x && renderer.cam.y === cam1.y);

    // 10. A drag with a Sprinkler held: nothing while the finger is down; once it drags, the preview
    // rises above the finger (0.3.03) and follows it there, and one Sprinkler goes where the preview
    // is when it lifts, not under the finger.
    await pick('sprinkler');
    s().players[me].cash += 2000;
    const row = freeRun('sprinkler', 5);
    n0 = count();
    const path = [0, 1, 2, 3, 4].map((i) => ({ x: row.x + i, y: row.y }));
    const p0 = under(path[0].x, path[0].y);
    fire('pointerdown', 11, p0.x, p0.y);
    await frameWait();
    const seen = [];
    let builtMeanwhile = false;
    for (let i = 1; i < path.length; i++) {
      await slide(11, under(path[i - 1].x, path[i - 1].y), under(path[i].x, path[i].y));
      await wait(LIFT.easeMs + 60); // the preview eases up the first time
      const h = input.hover;
      seen.push(h && h.x === path[i].x && h.y === path[i].y);
      if (count() !== n0) builtMeanwhile = true;
    }
    await frameWait();
    check('with a Sprinkler held, a finger moving over the floor builds nothing while it is down', !builtMeanwhile && count() === n0);
    check('... the preview follows the finger, lifted above it', seen.every(Boolean), seen.map((x) => (x ? 'y' : 'n')).join(''));
    check('... with no dashed aiming lines, and a line to the finger instead', input.view().aim === false && !!input.view().lift);
    check('... the hint that another finger cancels is showing', shown(aid()) && /another finger to cancel/.test(aid().textContent), aid().textContent);
    check('... with no Rotate button: a Sprinkler does not turn', !shown(turnBtn()));
    const last = under(path[4].x, path[4].y);
    const lastTile = renderer.tileAt(last.x, last.y);
    const ar = aid().getBoundingClientRect();
    check('... and the hint is not under the finger', !(last.x >= ar.left && last.x <= ar.right && last.y >= ar.top && last.y <= ar.bottom), `finger ${last.x | 0},${last.y | 0}; hint ${ar.left | 0}-${ar.right | 0}, ${ar.top | 0}-${ar.bottom | 0}`);
    fire('pointerup', 11, last.x, last.y);
    await wait(40);
    check('lifting the finger builds exactly one Sprinkler, where the lifted preview was',
      count() === n0 + 1 && b(path[4].x, path[4].y)?.k === 'sprinkler' && path.slice(0, 4).every((t) => !b(t.x, t.y)), `${count() - n0} built`);
    check('... and nothing under the finger', !!lastTile && (lastTile.y !== path[4].y) && b(lastTile.x, lastTile.y)?.k !== 'sprinkler', `finger on ${lastTile?.x},${lastTile?.y}`);
    await frameWait();
    check('... and the hint goes when the finger lifts', !shown(aid()) && input.placing === null);
    const sp = path[4];

    // 10b. Lifted with the preview on a tile that is taken: nothing is built, and the player is told why.
    const [f1] = freeTiles('sprinkler', 1);
    n0 = count();
    let nope0 = nopes;
    await finger([under(f1.x, f1.y), under(c1.x, c1.y)], 11, LIFT.easeMs + 60);
    await wait(40);
    check('lifted with the preview on a tile already built on, nothing is built', count() === n0 && b(c1.x, c1.y)?.k === 'crate' && !b(f1.x, f1.y));
    check('... and the refusal is reported, as for a tap', nopes === nope0 + 1, `${nopes - nope0} refusals`);

    // 10c. Lifted with the preview over a button (the camera pad): nothing is built, nothing refused.
    const padBtn = doc.querySelector('.tc-fit').getBoundingClientRect();
    const overPad = { x: padBtn.left + padBtn.width / 2, y: padBtn.top + padBtn.height / 2 + liftNow() };
    n0 = count(); nope0 = nopes;
    const camPad = { ...renderer.cam };
    await finger([under(f1.x, f1.y), overPad], 11, LIFT.easeMs + 60);
    await wait(40);
    check('lifted with the preview over a button, nothing is built or refused', count() === n0 && nopes === nope0 && renderer.cam.zoom === camPad.zoom);

    // 10f. Tap or drag (the owner, 0.3.03): a finger that does not drag places on the tapped tile
    // however long it rests; one that drags at all places where the lifted preview is, even when it
    // comes back to where it went down.
    const qs = freeTiles('sprinkler', 60);
    const q1 = qs[0], q2 = qs.find((t) => Math.abs(t.x - q1.x) > 2 || Math.abs(t.y - q1.y) > 3) || qs[qs.length - 1];
    n0 = count();
    const qp = at(q1.x, q1.y);
    fire('pointerdown', 11, qp.x, qp.y);
    fire('pointermove', 11, qp.x + 3, qp.y - 1); // a shaky finger
    await wait(600);
    check('a long, still press (600 ms, 3 px) keeps the preview under the finger', input.hover?.x === q1.x && input.hover?.y === q1.y && !input.view().lift);
    fire('pointerup', 11, qp.x + 3, qp.y - 1);
    await wait(40);
    check('... and places on the tapped tile', b(q1.x, q1.y)?.k === 'sprinkler' && count() === n0 + 1);
    const back = under(q2.x, q2.y); // the finger goes down below q2, so its lifted preview is on q2
    const downOn = renderer.tileAt(back.x, back.y);
    n0 = count();
    fire('pointerdown', 11, back.x, back.y);
    await frameWait();
    const firstOn = input.hover && `${input.hover.x},${input.hover.y}`;
    await slide(11, back, { x: back.x, y: back.y - 20 });
    await slide(11, { x: back.x, y: back.y - 20 }, back);
    await wait(LIFT.easeMs + 80);
    const stillUp = !!input.view().lift && input.hover?.x === q2.x && input.hover?.y === q2.y;
    fire('pointerup', 11, back.x, back.y);
    await wait(40);
    check('a press that drags 20 px and comes back stays lifted', stillUp, `preview first on ${firstOn}, finger on ${downOn?.x},${downOn?.y}`);
    check('... and places at the lifted tile, not the one it went down on', b(q2.x, q2.y)?.k === 'sprinkler' && count() === n0 + 1 && b(downOn.x, downOn.y)?.k !== 'sprinkler');

    // 10d. A second finger on the floor cancels, and the two then pinch.
    n0 = count();
    const [g1] = freeTiles('sprinkler', 1, { x: f1.x, y: f1.y });
    const gp = at(g1.x, g1.y);
    fire('pointerdown', 11, gp.x, gp.y);
    await slide(11, gp, { x: gp.x + 6, y: gp.y + 4 });
    await frameWait();
    const hintBefore = shown(aid());
    cam0 = { ...renderer.cam };
    const second = { x: gp.x + 50, y: gp.y + 40 };
    fire('pointerdown', 12, second.x, second.y);
    await frameWait();
    const hintAfterCancel = shown(aid());
    for (let k = 1; k <= 10; k++) {
      fire('pointermove', 11, gp.x + 6 - k * 6, gp.y + 4 - k * 5);
      fire('pointermove', 12, second.x + k * 6, second.y + k * 5);
      await wait(8);
    }
    fire('pointerup', 12, second.x + 60, second.y + 50);
    fire('pointerup', 11, gp.x - 54, gp.y - 46);
    await wait(40);
    check('a second finger on the floor cancels the placement: nothing is built when they lift', count() === n0 && !b(g1.x, g1.y));
    check('... the two fingers then zoom the view', renderer.cam.zoom > cam0.zoom * 1.2 || cam0.zoom > 71.9, `${cam0.zoom.toFixed(1)} -> ${renderer.cam.zoom.toFixed(1)} px a tile`);
    check('... the hint shows before and goes on the cancel', hintBefore && !hintAfterCancel);
    check('... and the Sprinkler stays picked', input.tool === 'sprinkler');

    // 10e. The Rotate button while placing turns the building and does not cancel. (Pressed by a
    // second finger: a pointerdown and pointerup on the button, and no click, which a phone may
    // never send for a second finger's tap.)
    renderer.fit(); input.goHome();
    await wait(80);
    await pick('railgun');
    s().players[me].cash += 3000;
    const dR = input.dir, dWant = (dR + 1) & 3;
    const [rl] = freeTiles('railgun', 1, null, dWant);
    n0 = count();
    const rp = at(rl.x, rl.y);
    fire('pointerdown', 11, rp.x, rp.y);
    fire('pointermove', 11, rp.x + 2, rp.y + 1);
    await frameWait();
    const tb = turnBtn();
    const tr = tb.getBoundingClientRect();
    check('with a Barcode Laser held, a big Rotate button shows while the finger is down', shown(tb) && tr.width >= 56 && tr.height >= 56, `${tr.width | 0} x ${tr.height | 0} px`);
    check('... not under the finger', !(rp.x >= tr.left && rp.x <= tr.right && rp.y >= tr.top && rp.y <= tr.bottom));
    for (const t of ['pointerdown', 'pointerup']) tb.dispatchEvent(new win.PointerEvent(t, { pointerType: 'touch', pointerId: 12, isPrimary: false, clientX: tr.left + 20, clientY: tr.top + 20, bubbles: true, cancelable: true }));
    await frameWait();
    check('a tap on it with another finger turns the building', input.dir === dWant, `dir ${dR} -> ${input.dir}`);
    check('... and does not cancel the placement', input.placing !== null && shown(aid()) && count() === n0);
    fire('pointerup', 11, rp.x + 2, rp.y + 1);
    await wait(40);
    const laser = b(rl.x, rl.y);
    check('... lifting places the Barcode Laser facing the turned way', laser?.k === 'railgun' && laser.d === dWant, `${laser?.k || 'nothing'} d=${laser?.d}`);

    // 11. Upgrades: with the Upgrade tool (the sheet of the building the finger lifts from), and
    // from the sheet.
    await pick('upgrade');
    renderer.centerOn(sp.x + 0.5, sp.y + 0.5);
    await wait(60);
    const [u0] = freeTiles('crate', 1, sp);
    const camU = { ...renderer.cam };
    await finger([at(u0.x, u0.y), at(sp.x, sp.y)]);
    await wait(80);
    check('a drag with the Upgrade tool opens the sheet of the building it lifts from', !sheet.classList.contains('hidden') && input.selected?.x === sp.x && input.selected?.y === sp.y);
    check('... and does not move the view', renderer.cam.x === camU.x && renderer.cam.y === camU.y);
    input.select(null);
    await wait(80); // (the sheet closes on the next frame; until then it is over the floor)
    await tap(at(sp.x, sp.y));
    await wait(80);
    check('a tap with the Upgrade tool opens the sheet', !sheet.classList.contains('hidden') && input.selected?.x === sp.x && input.selected?.y === sp.y);
    s().players[me].cash += 1000; // enough for a level of each
    await wait(80);
    const ups = [...sheet.querySelectorAll('.ts-up')];
    check('the sheet of a sprinkler has a button for each of its four upgrades', ups.length === 4 && ups.every((u) => !u.disabled), `${ups.length} buttons`);
    const lvOf = (t) => b(sp.x, sp.y)?.u?.[t] | 0;
    if (sheet.querySelector('.ts-dmg')) click(sheet.querySelector('.ts-dmg'));
    await wait(80);
    check("the sheet's Damage button buys a level of damage", lvOf('dmg') === 1 && lvOf('dur') === 0, `damage ${lvOf('dmg')}, durability ${lvOf('dur')}`);
    if (sheet.querySelector('.ts-dur')) click(sheet.querySelector('.ts-dur'));
    await wait(80);
    check('... and its Durability button a level of durability', lvOf('dmg') === 1 && lvOf('dur') === 1, `damage ${lvOf('dmg')}, durability ${lvOf('dur')}`);

    // 11b. The reach of the tapped building (0.3.02): drawn while its sheet is open, whether it was
    // tapped with the Upgrade tool or with nothing held; pressing Range buys a level and the reach,
    // grown, stays; closing the sheet or tapping bare floor takes it away. (input.view() is the
    // object the game hands the renderer each frame: view.selected and view.track are its own.)
    const reachNow = () => selectedReach(s(), input.view());
    const spB = () => b(sp.x, sp.y);
    check('a sprinkler tapped with the Upgrade tool has its reach drawn while its sheet is open', reachNow()?.b === spB() && reachNow()?.next === false,
      JSON.stringify(input.view().selected));
    const reach0 = statsOf(spB(), s()).range, rng0 = lvOf('rng');
    if (sheet.querySelector('.ts-rng')) click(sheet.querySelector('.ts-rng'));
    await wait(80);
    check('pressing Range buys a level, and the reach stays drawn, bigger', lvOf('rng') === rng0 + 1 && statsOf(spB(), s()).range > reach0 && reachNow()?.b === spB(),
      `range ${reach0} -> ${statsOf(spB(), s()).range}`);
    check('... with no second reach (a finger does not hover)', reachNow()?.next === false);
    click(sheet.querySelector('.ts-x'));
    await wait(80);
    check('closing the sheet takes the reach away', !input.view().selected && reachNow() === null);
    input.setTool(null);
    await wait(80);
    const [bare] = freeTiles('crate', 1, sp); // (looked for now: the open sheet hides some of the floor)
    await tap(at(sp.x, sp.y));
    await wait(80);
    check('a sprinkler tapped with nothing held has its reach drawn', reachNow()?.b === spB());
    await tap(at(bare.x, bare.y));
    await wait(80);
    check('tapping bare floor takes it away', reachNow() === null && sheet.classList.contains('hidden'));
    await pick('upgrade');
    input.select(null);

    // 12. The Remove tool removes exactly one building, where the finger lifts.
    renderer.fit(); input.goHome();
    await wait(80);
    await pick('remove');
    n0 = count();
    const rowNow = () => [0, 1, 2, 3, 4].map((i) => b(run5.x + i, run5.y)?.k || '-').join(',');
    const rowBefore = rowNow();
    await finger([at(run5.x, run5.y), at(run5.x + 4, run5.y)]);
    check('a drag with the Remove tool removes exactly one building, where the finger lifts', count() === n0 - 1 && !b(run5.x + 4, run5.y) && !!b(run5.x, run5.y) && !!b(run5.x + 1, run5.y),
      `${rowBefore} -> ${rowNow()}`);

    // 12b. The Remove tool removes with a single tap too: a one-tile building, and a bigger one
    // tapped on a tile that is not its top-left. (Until 0.2.09 a tap threw an error instead, which
    // the page showed as a red banner across the top, and nothing was removed.)
    const errRows = () => [...doc.querySelectorAll('.err-banner .err-row code')].map((c) => c.textContent);
    const errs0 = errRows().length;
    s().players[me].cash += 3000;
    const [wf] = freeTiles('wetfloor', 1);
    session.send({ c: 'place', k: 'wetfloor', x: wf.x, y: wf.y, d: 0 });
    const [ts] = freeTiles('salesman', 1).filter((t) => (t.x !== wf.x || t.y !== wf.y) && onFloor(t.x + 1, t.y + 1));
    session.send({ c: 'place', k: 'salesman', x: ts.x, y: ts.y, d: 0 });
    await wait(80);
    check('(set-up) a wet floor sign and a TV Salesman to remove', b(wf.x, wf.y)?.k === 'wetfloor' && b(ts.x, ts.y)?.k === 'salesman');
    // The Remove tool is still held from the drag above.
    await tap(at(wf.x, wf.y));
    await wait(80);
    check('a tap with the Remove tool removes a one-tile building', !b(wf.x, wf.y), `at ${wf.x},${wf.y}: ${b(wf.x, wf.y)?.k || 'gone'}`);
    await tap(at(ts.x + 1, ts.y + 1));
    await wait(80);
    check('... and a TV Salesman tapped on its bottom-right tile, all of it', [0, 1].every((dx) => [0, 1].every((dy) => !b(ts.x + dx, ts.y + dy))),
      `${b(ts.x, ts.y)?.k || 'gone'}`);
    check('... without an error banner', errRows().length === errs0, errRows().join(' | '));
    click(doc.querySelector('.tc-drop'));

    // 14. Dragging a building up out of its button in the bar (0.3.03). The finger's moves are sent
    // to the button, as the browser does once the button has captured the finger.
    renderer.fit(); input.goHome();
    await wait(80);
    const scroller = doc.querySelector('.bb-scroll');
    const btnFire = (el, type, id, x, y) => el.dispatchEvent(new win.PointerEvent(type, {
      pointerType: 'touch', pointerId: id, isPrimary: true, clientX: x, clientY: y,
      button: type === 'pointermove' ? -1 : 0, buttons: type === 'pointerup' || type === 'pointercancel' ? 0 : 1,
      bubbles: true, cancelable: true, width: 20, height: 20,
    }));
    /** Brings a bar button into sight (the bar scrolls sideways on a phone) and gives its middle. */
    function barSpot(k) {
      const btn = barBtn(k);
      const a = scroller.getBoundingClientRect(), r0 = btn.getBoundingClientRect();
      if (r0.left < a.left || r0.right > a.right) scroller.scrollLeft += r0.left - a.left - (a.width - r0.width) / 2;
      const r = btn.getBoundingClientRect();
      return { btn, x: r.left + r.width / 2, y: r.top + r.height / 2 };
    }
    /** A finger down on bar button k, up to `to` (moves in small steps); left down, or ended with `end`. */
    async function barDrag(k, to, { end = 'pointerup', id = 21, clickAfter = true } = {}) {
      const { btn, x, y } = barSpot(k);
      btnFire(btn, 'pointerdown', id, x, y);
      const n = Math.max(1, Math.ceil(Math.hypot(to.x - x, to.y - y) / 8));
      for (let i = 1; i <= n; i++) { btnFire(btn, 'pointermove', id, x + ((to.x - x) * i) / n, y + ((to.y - y) * i) / n); await wait(4); }
      await wait(LIFT.easeMs + 60);
      if (!end) return btn;
      btnFire(btn, end, id, to.x, to.y);
      // A phone may still send the button a click after the finger lifts: it must not pick the tool.
      if (clickAfter && end === 'pointerup') btn.click();
      await wait(40);
      return btn;
    }
    check('the bar lets the browser keep sideways swipes only (touch-action: pan-x)', win.getComputedStyle(scroller).touchAction === 'pan-x' && win.getComputedStyle(barBtn('crate')).touchAction === 'pan-x');
    s().players[me].cash += 5000;
    input.setTool(null);
    await wait(80);
    const [d1] = freeTiles('sprinkler', 1);
    n0 = count();
    const fd1 = under(d1.x, d1.y);
    const fingerTile1 = renderer.tileAt(fd1.x, fd1.y);
    const fingerHad1 = fingerTile1 && (b(fingerTile1.x, fingerTile1.y)?.k || '-');
    const dragBtn = await barDrag('sprinkler', fd1, { end: null });
    await frameWait();
    check('a building dragged up out of the bar follows the finger, lifted above it', input.carrying && input.view().tool === 'sprinkler' && input.hover?.x === d1.x && input.hover?.y === d1.y,
      `preview ${JSON.stringify(input.hover)}, wanted ${d1.x},${d1.y}`);
    check('... with the cancel hint showing, and nothing built yet', shown(aid()) && /another finger/.test(aid().textContent) && count() === n0);
    check('... and nothing picked meanwhile', input.tool === null);
    btnFire(dragBtn, 'pointerup', 21, fd1.x, fd1.y);
    dragBtn.click();
    await wait(60);
    check('lifting places exactly one, where the lifted preview was', b(d1.x, d1.y)?.k === 'sprinkler' && count() === n0 + 1, `${count() - n0} built`);
    check('... and nothing under the finger', !fingerTile1 || (b(fingerTile1.x, fingerTile1.y)?.k || '-') === fingerHad1, `finger on ${fingerTile1?.x},${fingerTile1?.y}`);
    check('... and afterwards nothing is held, as before the drag (the click after it is swallowed)', input.tool === null && !input.carrying && input.placing === null);
    await frameWait();
    check('... and the hint goes', !shown(aid()));

    // With a crate held, a Barcode Laser (it turns: Rotate shows) and a TV Salesman (2 x 2) dragged
    // from the bar: each placed with its footprint centred on the lifted point; the crate is held after.
    await pick('crate');
    const dL = input.dir;
    const [l1] = freeTiles('railgun', 1, null, dL);
    n0 = count();
    const lb = await barDrag('railgun', under(l1.x, l1.y, dL & 1 ? 1 : 3, dL & 1 ? 3 : 1), { end: null });
    await frameWait();
    check('dragging a Barcode Laser from the bar shows the big Rotate button', shown(turnBtn()));
    btnFire(lb, 'pointerup', 21, under(l1.x, l1.y, dL & 1 ? 1 : 3, dL & 1 ? 3 : 1).x, under(l1.x, l1.y, dL & 1 ? 1 : 3, dL & 1 ? 3 : 1).y);
    await wait(60);
    check('... and lifting places it with its footprint centred on the lifted point', b(l1.x, l1.y)?.k === 'railgun' && count() === n0 + 3, `${count() - n0} tiles built at ${l1.x},${l1.y}`);
    check('... and the crate is held again after', input.tool === 'crate');
    const [t2] = freeTiles('salesman', 40).filter((t) => [0, 1].every((dx) => [0, 1].every((dy) => !b(t.x + dx, t.y + dy) && onFloor(t.x + dx, t.y + dy) && canPlace(s(), 'salesman', t.x, t.y, me, 0) === null)));
    n0 = count();
    await barDrag('salesman', under(t2.x, t2.y, 2, 2));
    check('a TV Salesman (2 x 2) dragged from the bar goes with its footprint centred on the lifted point', b(t2.x, t2.y)?.k === 'salesman' && b(t2.x + 1, t2.y + 1)?.k === 'salesman' && count() === n0 + 4, `at ${t2.x},${t2.y}`);
    check('... and the crate is still held', input.tool === 'crate');

    // The belt from the bar: one belt where the lifted preview is, facing the current way.
    const [e1] = freeTiles('belt', 1);
    n0 = count();
    await barDrag('belt', under(e1.x, e1.y));
    check('the belt dragged from the bar places one belt at the lifted tile, facing the current way', b(e1.x, e1.y)?.k === 'belt' && b(e1.x, e1.y).d === input.dir && count() === n0 + 1);
    input.setTool(null);
    await wait(60);

    // A sideways swipe on the bar: the browser scrolls the bar and cancels the finger. Nothing built.
    n0 = count();
    {
      const { btn, x, y } = barSpot('forklift');
      btnFire(btn, 'pointerdown', 22, x, y);
      for (let i = 1; i <= 6; i++) { btnFire(btn, 'pointermove', 22, x - i * 8, y - 1); await wait(4); }
      btnFire(btn, 'pointercancel', 22, x - 48, y - 1);
      await wait(60);
    }
    check('a sideways swipe on the bar places nothing and picks nothing', count() === n0 && input.tool === null && input.placing === null && !input.carrying);

    // A second finger on the floor cancels a drag from the bar.
    const [g2] = freeTiles('sprinkler', 1);
    n0 = count(); nope0 = nopes;
    const cb = await barDrag('sprinkler', under(g2.x, g2.y), { end: null });
    const other = at(g2.x + 2, g2.y + 1);
    fire('pointerdown', 12, other.x, other.y);
    await wait(30);
    const cancelledNow = !input.carrying && input.placing === null;
    fire('pointerup', 12, other.x, other.y);
    btnFire(cb, 'pointerup', 21, under(g2.x, g2.y).x, under(g2.x, g2.y).y);
    await wait(60);
    check('a second finger on the floor cancels a drag from the bar: nothing is built when either lifts', cancelledNow && count() === n0 && !b(g2.x, g2.y) && !b(g2.x + 2, g2.y + 1));
    check('... nothing is held after, and nothing refused', input.tool === null && nopes === nope0);

    // Lifted with the preview off the floor (the finger near the top of the floor): nothing, quietly.
    const top = canvas.getBoundingClientRect().top;
    n0 = count(); nope0 = nopes;
    const ob = await barDrag('sprinkler', { x: mid.x, y: top + 20 }, { end: null });
    await frameWait();
    const noPreview = input.hover === null;
    btnFire(ob, 'pointerup', 21, mid.x, top + 20);
    await wait(60);
    check('lifted with the preview off the floor, nothing is built or refused', noPreview && count() === n0 && nopes === nope0);

    // The browser cancelling the finger mid-drag (pointercancel): nothing held, nothing previewed.
    n0 = count();
    const pb = await barDrag('forklift', { x: mid.x, y: mid.y }, { end: 'pointercancel' });
    await frameWait();
    check('a pointercancel mid-drag leaves nothing built, held or previewed', count() === n0 && input.tool === null && !input.carrying && input.placing === null && input.hover === null && !input.view().tool && !shown(aid()));
    void pb;

    // 15. The edge slide (0.3.03): a finger placing a building held near an edge of the floor slides
    // the view that way, and it stops when the finger leaves the edge or lifts.
    renderer.zoomBy(3);
    renderer.centerOn(s().w / 2, s().h / 2);
    await wait(80);
    const cr = canvas.getBoundingClientRect();
    const camE = { ...renderer.cam };
    const se = await barDrag('crate', { x: mid.x, y: mid.y }, { end: null });
    const camMid = { ...renderer.cam };
    await (async () => { for (let i = 1; i <= 8; i++) { btnFire(se, 'pointermove', 21, mid.x + ((cr.right - 6 - mid.x) * i) / 8, mid.y); await wait(4); } })();
    await wait(500);
    const camSlid = { ...renderer.cam };
    check('a finger held at the right edge of the floor slides the view right, slowly', camSlid.x > camMid.x + 0.5 && camSlid.x - camMid.x < EDGE.tilesPerSec * 0.8 && Math.abs(camMid.x - camE.x) < 0.01,
      `${camMid.x.toFixed(2)} -> ${camSlid.x.toFixed(2)} tiles`);
    btnFire(se, 'pointermove', 21, mid.x, mid.y);
    await wait(40);
    const camStop = { ...renderer.cam };
    await wait(300);
    check('... and stops when the finger moves off the edge', Math.abs(renderer.cam.x - camStop.x) < 0.01 && Math.abs(renderer.cam.y - camStop.y) < 0.01);
    // Just above the bar, never having been up on the floor clear of its bottom edge: no slide down.
    btnFire(se, 'pointercancel', 21, mid.x, mid.y);
    await wait(40);
    renderer.zoomBy(2.5); // (so the store is taller than the view and can slide down)
    renderer.centerOn(s().w / 2, s().h / 2);
    await wait(60);
    const b2 = await barDrag('crate', { x: mid.x, y: cr.bottom - 10 }, { end: null });
    const camLow = { ...renderer.cam };
    await wait(400);
    check('a building just picked up from the bar does not at once slide the view down', Math.abs(renderer.cam.y - camLow.y) < 0.01);
    btnFire(b2, 'pointermove', 21, mid.x, mid.y);
    await wait(30);
    btnFire(b2, 'pointermove', 21, mid.x, cr.bottom - 6);
    await wait(500);
    const camDown = { ...renderer.cam };
    check('... but once it has been up on the floor, the bottom edge slides it down', camDown.y > camLow.y + 0.5, `${camLow.y.toFixed(2)} -> ${camDown.y.toFixed(2)}`);
    n0 = count();
    btnFire(b2, 'pointerup', 21, mid.x, cr.bottom - 6);
    await wait(40);
    const camUp = { ...renderer.cam };
    await wait(300);
    check('... and stops when the finger lifts', Math.abs(renderer.cam.x - camUp.x) < 0.01 && Math.abs(renderer.cam.y - camUp.y) < 0.01);
    // A finger on the floor placing a held building slides it too.
    await pick('crate');
    const camF = { ...renderer.cam };
    fire('pointerdown', 11, mid.x, mid.y);
    await slide(11, mid, { x: cr.left + 6, y: mid.y });
    await wait(500);
    check('a finger on the floor placing a building slides the view at the left edge too', renderer.cam.x < camF.x - 0.5, `${camF.x.toFixed(2)} -> ${renderer.cam.x.toFixed(2)}`);
    fire('pointerdown', 12, mid.x, mid.y); // (cancelled: nothing built)
    fire('pointerup', 12, mid.x, mid.y);
    fire('pointerup', 11, cr.left + 6, mid.y);
    await wait(40);
    input.setTool(null);

    // 13. The camera buttons.
    renderer.zoomBy(2.5);
    click(doc.querySelector('.tc-fit'));
    const r = renderer.viewRect();
    check('the map button shows the whole map', r.x1 - r.x0 >= s().w - 0.5 || r.y1 - r.y0 >= s().h - 0.5);
    renderer.zoomBy(2.5);
    renderer.centerOn(s().w - 1, s().h - 1);
    const far = { ...renderer.cam };
    click(doc.querySelector('.tc-home'));
    check('the home button moves the view to my entrance', renderer.cam.x < far.x);

    // Leave a held belt and a placed line on screen for the picture.
    renderer.fit(); input.goHome();
    await pick('belt');
  }
</script>
</body>
</html>
