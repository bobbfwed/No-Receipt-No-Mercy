<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App icon (tool page)</title>
<style>html, body { margin: 0; height: 100%; background: #dc2626; } svg { display: block; width: 100vw; height: 100vh; }</style>
</head>
<body>
<!--
  Draws the game's app icon, full window. The PNG files in icons/ are photographs of this page:
    node tools/realshot.mjs http://localhost:5173/tools/icon.html icons/icon-512.png 500 512 512
    node tools/realshot.mjs http://localhost:5173/tools/icon.html icons/icon-192.png 500 192 192
  The artwork keeps clear of the edges, so phones that crop icons to a circle do not cut it.
-->
<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" fill="#dc2626"/>
  <g transform="rotate(-8 256 256)">
    <rect x="96" y="120" width="320" height="272" rx="22" fill="#facc15" stroke="#111827" stroke-width="18"/>
    <path d="M96 176h320" stroke="#111827" stroke-width="14"/>
    <text x="256" y="162" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="34" text-anchor="middle" fill="#111827">NO RECEIPT</text>
    <text x="256" y="330" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="170" text-anchor="middle" fill="#111827">$</text>
    <path d="M150 232L362 356" stroke="#dc2626" stroke-width="26" stroke-linecap="round"/>
  </g>
</svg>
</body>
</html>
