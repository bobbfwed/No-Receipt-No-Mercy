<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Two players, one screen (test page)</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; font: 14px "Segoe UI", system-ui, sans-serif; color: #ddd; }
  .row { display: flex; height: 100%; gap: 4px; }
  .col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .col p { margin: 0; padding: 4px 10px; background: #222; }
  iframe { flex: 1; border: 0; width: 100%; }
</style>
</head>
<body>
<!--
  A test page: runs a host and a joining player side by side in one window, linked the same way
  two tabs of one browser would be (no internet needed). Open it through the dev server:
    http://localhost:5173/tools/two-player.html
  Add ?autostart=1 to have the host open the doors by itself, and ?ff=600 to skip ahead.
  Add ?online=1 to link them over the internet instead (needs the PeerJS broker to be reachable).
  &map=showroom&size=m picks the store (see MAP_DESIGNS and MAP_SIZES in src/sim/maps.js).
-->
<div class="row">
  <div class="col"><p>Host (Dave)</p><iframe id="host" title="Host"></iframe></div>
  <div class="col"><p>Joined player (Steve)</p><iframe id="join" title="Joined player"></iframe></div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const code = 'T' + Math.random().toString(36).slice(2, 6).toUpperCase();
  const extra = ['autostart', 'ff', 'seed', 'map', 'size'].filter((k) => q.has(k)).map((k) => `&${k}=${encodeURIComponent(q.get(k))}`).join('');
  // ?online=1 links the two through the internet broker instead, exactly as two houses would.
  const how = q.has('online') ? 'online' : 'local';
  const room = how === 'online' ? ('Q' + code).slice(0, 5).replace(/[^A-Z]/g, 'X') : code;
  document.getElementById('host').src = `../index.html?${how}=host&code=${room}&name=Dave${extra}`;
  // The host must be listening before the second player knocks.
  setTimeout(() => {
    document.getElementById('join').src = `../index.html?${how}=join&code=${room}&name=Steve`;
  }, how === 'online' ? 5000 : 1200);
</script>
</body>
</html>
