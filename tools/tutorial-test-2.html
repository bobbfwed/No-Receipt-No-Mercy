<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tutorial part 2 played by simulated mouse and keyboard (test page)</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
  #log { position: fixed; right: 8px; top: 60px; z-index: 9; background: #000d; color: #9f9; font: 12px Consolas, monospace; padding: 6px 10px; white-space: pre; max-width: 52ch; }
</style>
</head>
<body>
<!--
  A test page: opens the training shift, presses "Jump to part 2", and plays every lesson of part 2
  ("The difficult customers": dads, the Barcode Laser, the gym bro) with made-up mouse and keyboard
  events, following each lesson's own "Do this" text: number keys (and -) to pick a tool, R to turn
  it, clicks on the highlighted tiles, B to rebuild, and the OPEN THE DOORS button. It reports each
  lesson reached; if an instruction were wrong or a control did not work, the lesson number would
  stop going up.
  The game runs at 3x speed (the speed buttons at the top) to keep the page quick.
  Open through the dev server: http://localhost:5173/tools/tutorial-test-2.html
  (Use tools/realshot.mjs to photograph it, waiting about 120 seconds.)
-->
<iframe id="game" src="../index.html?tutorial=1&name=Tester" title="Game"></iframe>
<div id="log"></div>
<script>
  const frame = document.getElementById('game');
  const log = (t) => { document.getElementById('log').textContent += t + '\n'; };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  frame.addEventListener('load', async () => {
    const win = frame.contentWindow, doc = frame.contentDocument;
    await wait(700);
    const canvas = doc.querySelector('canvas');
    const at = (tx, ty) => {
      const r = canvas.getBoundingClientRect();
      const cam = win.__game.renderer.cam; // the game's own camera
      return { clientX: r.left + r.width / 2 + (tx + 0.5 - cam.x) * cam.zoom, clientY: r.top + r.height / 2 + (ty + 0.5 - cam.y) * cam.zoom };
    };
    const mouse = (type, tx, ty, button = 0) => canvas.dispatchEvent(new win.PointerEvent(type, {
      ...at(tx, ty), button, buttons: type === 'pointerup' ? 0 : 1, pointerId: 1, bubbles: true, cancelable: true,
    }));
    const key = (k, code) => win.dispatchEvent(new win.KeyboardEvent('keydown', { key: k, code: code || `Key${k.toUpperCase()}`, bubbles: true }));
    const click = (tx, ty, button = 0) => { mouse('pointermove', tx, ty); mouse('pointerdown', tx, ty, button); mouse('pointerup', tx, ty, button); };
    const lesson = () => (doc.querySelector('.tut-count')?.textContent || '?') + ' "' + (doc.querySelector('.tut-title')?.textContent || '') + '"';
    const hint = () => doc.querySelector('.tut-hint:not(.hidden)')?.textContent || '';
    const press = (text) => { const b = [...doc.querySelectorAll('button')].find((el) => el.textContent.trim().toLowerCase() === text.toLowerCase() && !el.classList.contains('hidden')); if (b) b.click(); return !!b; };
    /** Waits until the panel shows a different lesson, or gives up. */
    const until = async (before, ms) => { const end = Date.now() + ms; while (Date.now() < end) { if (lesson() !== before) return true; await wait(150); } return false; };
    const stepDone = async (what, ms = 4000) => { const before = lesson(); const ok = await until(before, ms); log((ok ? 'ok   ' : 'STUCK ') + what + ' -> ' + lesson()); return ok; };
    const doors = async () => { await wait(300); log(press('OPEN THE DOORS') ? 'ok   pressed OPEN THE DOORS' : 'STUCK no OPEN THE DOORS button'); };

    log('start: ' + lesson());
    let b = lesson();
    if (!press('Jump to part 2')) { log('STUCK no Jump to part 2 button'); return; }
    await until(b, 5000); log('ok   Jump to part 2 -> ' + lesson());
    press('3x');
    b = lesson(); press('Next'); await until(b, 2000); log('ok   Next -> ' + lesson());

    // Dads: just open the doors and watch them walk over the belts.
    await doors();
    if (!await stepDone('four dads walked through the belts', 30000)) return;

    // Stopping dads: "put a Forklift (press 8) on the highlighted tile ..., Wet Floor Signs (press 9)
    // on the two tiles in front of the belt and a Crate (press 6) below them, then OPEN THE DOORS".
    key('8', 'Digit8'); click(12, 6);
    key('9', 'Digit9'); click(9, 7); click(9, 8);
    key('6', 'Digit6'); click(9, 9);
    key('Escape', 'Escape');
    await doors();
    if (!await stepDone('forklift, signs and crate; five dads', 30000)) return;

    // The Barcode Laser: "click Laser (or press -), press R until the arrow on the preview points
    // LEFT, click the left end of the three highlighted tiles, then press OPEN THE DOORS".
    key('-', 'Minus'); key('r'); key('r'); click(12, 7);
    key('Escape', 'Escape');
    await doors();
    if (!await stepDone('laser facing left, ten dads', 30000)) return;

    // Gym Bros: crates by the entrance, open the doors, then B once he has gone.
    key('6', 'Digit6'); click(2, 7); click(2, 8); click(1, 9);
    key('Escape', 'Escape');
    await doors();
    const end = Date.now() + 30000;
    while (Date.now() < end && !/Press B/.test(hint()) && lesson().includes('Gym')) await wait(150);
    log(/Press B/.test(hint()) ? 'ok   he wrecked something; the hint says to press B' : 'STUCK no rebuild hint: ' + hint());
    key('b');
    if (!await stepDone('crates rebuilt with B')) return;
    log('DONE: reached ' + lesson());
  });
</script>
</body>
</html>
