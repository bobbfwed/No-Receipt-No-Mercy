<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tutorial parts 2 and 3 played by simulated mouse and keyboard (test page)</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
  #log { position: fixed; right: 8px; top: 60px; z-index: 9; background: #000d; color: #9f9; font: 12px Consolas, monospace; padding: 6px 10px; white-space: pre; max-width: 60ch; }
</style>
</head>
<body>
<!--
  A test page: opens the training shift, presses "Jump to The Back", and plays every lesson after
  it (The Back, Razor Wire, gym bros, money) with made-up mouse and keyboard events, following each
  lesson's own "Do this" text: Tab to change floors, number keys (and -) to pick a part, R to turn
  it, a drag to lay belts, right-click to take a part out, Z for the Wire tool, U for Reinforce, B to
  rebuild, a Returns Drop's MORE JUNK, and the OPEN THE DOORS button. It reports each lesson reached;
  if an instruction were wrong or a control did not work, the lesson number would stop going up.
  Running dry has a minute-long crowd, so the page plays it at 5x.
  Open through the dev server: http://localhost:5173/tools/tutorial-test-2.html
  (Use tools/realshot.mjs to photograph it, waiting about 150 seconds; window.__result is 'DONE'
  or 'STUCK' at the end, for its --eval.)
-->
<iframe id="game" src="../index.html?tutorial=1&name=Tester" title="Game"></iframe>
<div id="log"></div>
<script>
  const frame = document.getElementById('game');
  const log = (t) => { document.getElementById('log').textContent += t + '\n'; };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  window.__result = 'running';

  frame.addEventListener('load', async () => {
    const win = frame.contentWindow, doc = frame.contentDocument;
    await wait(700);
    const canvas = doc.querySelector('canvas');
    const at = (tx, ty) => {
      const r = canvas.getBoundingClientRect();
      const cam = win.__game.renderer.cam; // the game's own camera
      return { clientX: r.left + r.width / 2 + (tx + 0.5 - cam.x) * cam.zoom, clientY: r.top + r.height / 2 + (ty + 0.5 - cam.y) * cam.zoom };
    };
    const mouse = (type, tx, ty, button = 0) => canvas.dispatchEvent(new win.PointerEvent(type, {
      ...at(tx, ty), button, buttons: type === 'pointerup' ? 0 : button === 2 ? 2 : 1, pointerId: 1, bubbles: true, cancelable: true,
    }));
    const key = (k, code) => win.dispatchEvent(new win.KeyboardEvent('keydown', { key: k, code: code || `Key${k.toUpperCase()}`, bubbles: true, cancelable: true }));
    const click = (tx, ty, button = 0) => { mouse('pointermove', tx, ty); mouse('pointerdown', tx, ty, button); mouse('pointerup', tx, ty, button); };
    // A drag along a column or row, one tile at a time, as a hand would move the mouse.
    const drag = async (x0, y0, x1, y1) => {
      mouse('pointermove', x0, y0); mouse('pointerdown', x0, y0); await wait(30);
      const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0));
      for (let i = 1; i <= n; i++) { mouse('pointermove', x0 + Math.sign(x1 - x0) * i, y0 + Math.sign(y1 - y0) * i); await wait(20); }
      mouse('pointerup', x1, y1);
    };
    /** Turns what is held with R until it faces d (0 east, 1 south, 2 west, 3 north). */
    const face = (d) => { for (let i = 0; i < 4 && win.__game.input.dir !== d; i++) key('r'); };
    const tab = async () => { key('Tab', 'Tab'); await wait(250); };
    const floor = () => win.__game.input.floor;
    const lesson = () => (doc.querySelector('.tut-count')?.textContent || '?') + ' "' + (doc.querySelector('.tut-title')?.textContent || '') + '"';
    const hint = () => doc.querySelector('.tut-hint:not(.hidden)')?.textContent || '';
    const press = (text) => { const b = [...doc.querySelectorAll('button')].find((el) => el.textContent.trim().toLowerCase() === text.toLowerCase() && !el.classList.contains('hidden')); if (b) b.click(); return !!b; };
    /** Waits until the panel shows a different lesson, or gives up. */
    const until = async (before, ms) => { const end = Date.now() + ms; while (Date.now() < end) { if (lesson() !== before) return true; await wait(150); } return false; };
    const stepDone = async (what, ms = 6000) => {
      const before = lesson(); const ok = await until(before, ms);
      log((ok ? 'ok   ' : 'STUCK ') + what + ' -> ' + lesson() + (ok ? '' : `  (hint: ${hint()})`));
      if (!ok) window.__result = 'STUCK';
      return ok;
    };
    const doors = async () => { await wait(300); log(press('OPEN THE DOORS') ? 'ok   pressed OPEN THE DOORS' : 'STUCK no OPEN THE DOORS button'); };

    log('start: ' + lesson());
    let b = lesson();
    if (!press('Jump to The Back')) { log('STUCK no Jump to The Back button'); window.__result = 'STUCK'; return; }
    await until(b, 8000); log('ok   Jump to The Back -> ' + lesson());
    press('3x');

    // Downstairs: Tab.
    await tab();
    if (!await stepDone('Tab: looking at The Back')) return;
    // A Spite Still facing down on (10, 4), then one belt from (10, 3) onto it.
    key('6', 'Digit6'); face(1); click(10, 4);
    key('1', 'Digit1'); await drag(10, 3, 10, 4);
    if (!await stepDone('Spite Still and a belt; the Still made Spite', 10000)) return;
    // The line down column 10 into the gap Sprinkler's Dumbwaiter, then Tab back up.
    await drag(10, 5, 10, 13);
    const end = Date.now() + 15000;
    while (Date.now() < end && !/Tab/.test(hint())) await wait(150);
    await tab();
    if (!await stepDone('a line of belts down to the Sprinkler, then back up', 10000)) return;
    // An Unpaid Intern facing left beside the line, at the Forklift's height.
    await tab(); key('4', 'Digit4'); face(2); click(9, 9);
    if (!await stepDone('an Unpaid Intern stocks the Forklift', 10000)) return;
    // A Splitter facing down straight on the belt above the gap Sprinkler (0.4.01: it replaces the
    // belt); a belt into the second one.
    key('Escape', 'Escape');
    key('2', 'Digit2'); face(1); click(10, 12);
    key('1', 'Digit1'); await drag(9, 12, 9, 13);
    if (!await stepDone('a Splitter stocks both Sprinklers', 15000)) return;
    // Running dry: take out the belt behind the Intern, go up, open the doors at 5x.
    key('Escape', 'Escape'); click(10, 9, 2); await tab();
    press('5x');
    await doors();
    if (!await stepDone('the Forklift ran out of Spite', 60000)) return;
    // The Rebrander straight on the belt above the gap (0.4.01: key 0, the Tape Winder gone), and
    // the belt back.
    await tab();
    key('0', 'Digit0'); face(1); click(10, 8);
    key('1', 'Digit1'); await drag(10, 9, 10, 10);
    await tab();
    if (!await stepDone('a Rebrander: the Forklift gets Name Brand', 20000)) return;
    // Razor Wire: Z, click the Forklift once (north).
    if (floor() !== 0) await tab();
    key('z'); click(8, 9);
    if (!await stepDone('the Forklift\'s wire points north (planned)')) return;
    // A Barb Bender facing right between the second drop and the Forklift; then six dads.
    key('Escape', 'Escape'); await tab(); key('9', 'Digit9'); face(0); click(7, 9);
    await wait(2500); await tab();
    await doors();
    if (!await stepDone('live wire turned the dads away', 40000)) return;
    // Gym Bros: crates by the entrance, open the doors, then B once he has gone.
    key('1', 'Digit1'); click(2, 7); click(2, 8); click(1, 9);
    key('Escape', 'Escape');
    await doors();
    const end2 = Date.now() + 30000;
    while (Date.now() < end2 && !/Press B/.test(hint()) && lesson().includes('Gym')) await wait(150);
    log(/Press B/.test(hint()) ? 'ok   he wrecked something; the hint says to press B' : 'STUCK no rebuild hint: ' + hint());
    key('b');
    if (!await stepDone('crates rebuilt with B')) return;
    // Reinforce: U, each of the three crates once, then another gym bro.
    key('u'); click(2, 7); click(2, 8); click(1, 9);
    key('Escape', 'Escape');
    await doors();
    if (!await stepDone('reinforced crates held', 30000)) return;
    // Money: Tab, click the first Returns Drop with nothing held, MORE JUNK.
    key('Escape', 'Escape'); await tab(); click(10, 2);
    await wait(400);
    const more = doc.querySelector('.touch-sheet .ts-more');
    if (more) more.click(); else log('STUCK no MORE JUNK button');
    if (!await stepDone('MORE JUNK bought')) return;
    log('DONE: reached ' + lesson());
    window.__result = 'DONE';
  });
</script>
</body>
</html>
