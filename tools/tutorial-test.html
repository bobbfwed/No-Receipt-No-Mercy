<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tutorial part 1 played by simulated mouse and keyboard (test page)</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
  #log { position: fixed; right: 8px; top: 60px; z-index: 9; background: #000d; color: #9f9; font: 12px Consolas, monospace; padding: 6px 10px; white-space: pre; max-width: 46ch; }
</style>
</head>
<body>
<!--
  A test page: opens the training shift and plays part 1 (every lesson up to "Jump to part 2") with
  made-up mouse and keyboard events, exactly as a new player would be told to: number keys to pick
  the tool, R to rotate, click or drag on the highlighted tiles, right-click to remove, and the OPEN
  THE DOORS button. It reports the lesson reached. If the tutorial's instructions were wrong or a
  control did not work, the lesson number would stop going up.
  The game runs at 3x speed (the speed buttons at the top) to keep the page quick.
  Open through the dev server: http://localhost:5173/tools/tutorial-test.html
  (Use tools/realshot.mjs to photograph it, waiting about 120 seconds.)
-->
<iframe id="game" src="../index.html?tutorial=1&name=Tester" title="Game"></iframe>
<div id="log"></div>
<script>
  const frame = document.getElementById('game');
  const log = (t) => { document.getElementById('log').textContent += t + '\n'; };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  frame.addEventListener('load', async () => {
    const win = frame.contentWindow, doc = frame.contentDocument;
    await wait(700);
    const canvas = doc.querySelector('canvas');
    const at = (tx, ty) => {
      const r = canvas.getBoundingClientRect();
      const cam = win.__game.renderer.cam; // the game's own camera
      return { clientX: r.left + r.width / 2 + (tx + 0.5 - cam.x) * cam.zoom, clientY: r.top + r.height / 2 + (ty + 0.5 - cam.y) * cam.zoom };
    };
    const mouse = (type, tx, ty, button = 0) => canvas.dispatchEvent(new win.PointerEvent(type, {
      ...at(tx, ty), button, buttons: type === 'pointerup' ? 0 : 1, pointerId: 1, bubbles: true, cancelable: true,
    }));
    const key = (k, code) => win.dispatchEvent(new win.KeyboardEvent('keydown', { key: k, code: code || `Key${k.toUpperCase()}`, bubbles: true }));
    const click = (tx, ty, button = 0) => { mouse('pointermove', tx, ty); mouse('pointerdown', tx, ty, button); mouse('pointerup', tx, ty, button); };
    const drag = async (x0, y0, x1, y1) => { mouse('pointermove', x0, y0); mouse('pointerdown', x0, y0); await wait(40); mouse('pointermove', x1, y1); await wait(40); mouse('pointerup', x1, y1); };
    const lesson = () => (doc.querySelector('.tut-count')?.textContent || '?') + ' "' + (doc.querySelector('.tut-title')?.textContent || '') + '"';
    const press = (text) => { const b = [...doc.querySelectorAll('button')].find((el) => el.textContent.trim().toLowerCase() === text.toLowerCase() && !el.classList.contains('hidden')); if (b) b.click(); return !!b; };
    /** Waits until the panel shows a different lesson, or gives up. */
    const until = async (before, ms) => { const end = Date.now() + ms; while (Date.now() < end) { if (lesson() !== before) return true; await wait(150); } return false; };
    const stepDone = async (what, ms = 4000) => { const before = lesson(); const ok = await until(before, ms); log((ok ? 'ok   ' : 'STUCK ') + what + ' -> ' + lesson()); return ok; };

    const doors = async () => { await wait(300); log(press('OPEN THE DOORS') ? 'ok   pressed OPEN THE DOORS' : 'STUCK no OPEN THE DOORS button'); };

    log('start: ' + lesson());
    let b = lesson(); press('Next'); await until(b, 2000); log('ok   Next -> ' + lesson());
    press('3x');

    key('1', 'Digit1'); await drag(10, 1, 10, 13);              // crates, one drag down the column
    if (!await stepDone('wall of crates dragged down 13 tiles')) return;
    click(10, 14);                                               // must be refused
    if (!await stepDone('blocking the last gap was refused')) return;
    click(10, 13, 2); key('2', 'Digit2'); click(10, 13);         // right-click the crate away, sprinkler in its place
    await doors();
    if (!await stepDone('crate removed, sprinkler placed, clippers wave finished', 40000)) return;
    key('5', 'Digit5'); click(10, 14); key('2', 'Digit2'); click(9, 13);
    await doors();
    if (!await stepDone('wet floor sign and second sprinkler, ten clippers', 40000)) return;
    key('6', 'Digit6'); click(8, 13);
    await doors();
    if (!await stepDone('free samples, sixteen clippers', 40000)) return;
    key('7', 'Digit7'); click(4, 13); key('2', 'Digit2'); click(5, 12);
    await doors();
    if (!await stepDone('salesman and sprinkler, thirty clippers', 60000)) return;
    key('2', 'Digit2'); click(7, 13);
    await doors();
    if (!await stepDone('third sprinkler, eight super clippers', 40000)) return;
    key('4', 'Digit4'); key('r'); click(6, 4);                   // the laser, turned once to face down
    key('Escape', 'Escape');
    await doors();
    if (!await stepDone('laser facing down, thirty super clippers', 60000)) return;
    log('DONE: reached ' + lesson());
  });
</script>
</body>
</html>
