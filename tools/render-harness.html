<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Render harness</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1f24; overflow: hidden; }
  canvas#c { display: block; width: 100vw; height: 100vh; }
  #mini { position: fixed; right: 12px; bottom: 26px; width: 200px; height: 110px; background: rgba(20,24,28,0.85);
          border: 2px solid #1d2125; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.5); display: none; cursor: pointer; }
  #err { position: fixed; left: 16px; top: 16px; right: 16px; color: #ff3b30; font: bold 28px/1.3 "Segoe UI", Arial, sans-serif;
         white-space: pre-wrap; text-shadow: 0 2px 0 #000; pointer-events: none; }
  #stats { position: fixed; right: 8px; bottom: 6px; color: #fff; font: 12px Consolas, monospace; text-shadow: 0 1px 0 #000; }
</style>
<!--
  Test page for the canvas renderer. URL options:
    ?seed=7        random seed (default 7)
    &design=showroom  map design: a key of MAP_DESIGNS (warehouse, showroom, aisles, food, carpark, corridors...) (giving design or size makes a
                   map with six entrances, as a real game does; without either it is the original
                   30 x 16 warehouse with one entrance, which the demo layout is made for)
    &size=m        map size: xs, s, m, l, xl, xxl, huge, titan
    &players=3     that many players in all (so that many entrances open)
    &floor=1       look at The Back (the floor under the shop, 0.4) instead of the shop floor
    &cam=40,20,30  camera: centre on tile 40,20 at 30 CSS pixels per tile (any part may be empty)
    &fitview=1     start fully zoomed out
    &mini=1        show the minimap in the bottom-right corner (click it to move the view)
    &demo=0        do not build the demo layout (on other maps it is placed where it fits)
    &extra=1       also build a few more Crate Stacks and a Free Samples table, two Barcode Lasers (one
                   lying east-west, one north-south) and a TV Salesman (to see every building kind),
                   and on The Back a loop of belts turning right and a line turning left, each fed
                   by a Splitter (corners and turns; see them with &floor=1)
    &stock=1       stock every security building with supplies from The Back, a different mix of
                   supplies and tiers on each, so their level badges and supply pips show
    &damage=1      as if gym bros had hit every other building: some once, some down to their
                   last hit (smoke and sparks)
    &off=1         switch off every other piece of security, as if a stray dog had peed on it
    &rubble=1      wreck a few buildings and leave the rubble (as a gym bro would); every other
                   wreck is paid for and waiting (0.3.04), so it carries the orange cone (add
                   &freeze=1 to keep them: a running game puts a paid-for wreck back at once)
    &wave=N        start at wave N (later waves bring dads, Karens and scooters; moms from 3,
                   teenagers from 4, guide dogs from 6, gym bros from 8; day drinkers from 5,
                   stray dogs from 7, exhibitionists from 8, cosplayers from 9; supers from 6 on)
    &supers=1      make every third shopper a super shopper
    &nostart=1     stay in the build phase
    &ff=600        run that many ticks before the first frame
    &tool=crate&hx=10&hy=5&dir=1   placement preview (tool may be 'remove'; a Back part such as
                   conv with &floor=1);
                   no hx/hy = follow the mouse. dir is the facing (it turns a Barcode Laser's footprint)
    &cash=5000     the player's money (previews of expensive things show red without it)
    &route=1       draw the shopper routes
    &cursors=1     two more players with pointers
    &wall=3        crate stacks down that column (gym bros smash through; seed 7 wave 8: tick 652)
    &stats=1       show frame timing (and every 60 frames the average draw time)
    &null=1        a session with no state (should draw only the background)
    &showcase=1    the new rules on the small map, through the real renderer, frozen (the clock
                   still runs for the animations): Barcode Lasers facing all four ways (one charged,
                   one half charged, one just fired), TV Salesmen (one switched off), stocked,
                   damaged and switched-off buildings, rubble of a big building, and a crowd of
                   every new shopper and super in every state: dogs walking, peeing on switched-off
                   security and watching the TV, the four cosplay costumes and the mech suit, the
                   exhibitionist with her robe shut and open (with a dad and a teenager staring),
                   Nudist Nan, the day drinker walking and lying face down, the Bottomless
                   Bruncher, and every mom state (cart, chasing, child waiting, carrying him,
                   crawling with and without her cart, the cart she left behind, from
                   state.carts), and the boss at all four tiers (the CEO mid pep talk). Add
                   &allfx=1 for the effects there too (the boss's included).
    &lineup=1      every shopper kind in every state, large (fitted to the window, or &zoom=2),
                   with the super version of each in the columns on the right, plus messes,
                   wreckage and every effect at &fxage=350 ms old; &pan=x,y scrolls it (logical
                   pixels) for close-ups with a big &zoom. Columns: walking right, walking left,
                   browsing (or watching, for the newer kinds), stunned, leaving, then each kind's
                   own extra poses (listed in the code), then the super versions. Above the boss:
                   the Pregnant Lady (extras: watching the TV, about to pop; Octomom on the right)
                   and her babies, with her effects beside the babies (a pop, an Octomom's pop,
                   "NOT TODAY", a baby giving up, five babies' refunds at one till). The last row
                   is the boss at his four ranks (walking, standing, pep talk, storming off), with
                   his effects to the right of it.
    &pop=sprinkler a real Pregnant Lady popping, through the real rules: with no demo layout, a
                   Pepper Sprinkler is placed beside the route three tiles inside the first
                   entrance (any design and size), one Pregnant Lady walks in with one patience
                   left, the game runs until she pops, then &after=12 more ticks (the babies run
                   off; &after=90 to see them spread along the route), and stops there (the clock
                   still runs for the animations). Her 'left' and 'pop' events are sent again every
                   &every=500 ms; one still showing is not restarted, so the effect is on screen
                   nearly all the time. &pop=laser: a Barcode Laser across the route instead, so she
                   does not pop ('nopop', no babies). &octo=1 makes her an Octomom (24 babies).
                   Starts at sales event 14 unless &wave= is given. The bottom-right corner says
                   what happened. Example, whole map: ?pop=sprinkler&octo=1&size=s&fitview=1&after=60
    &holiday=xmas  the game's holiday (a key of HOLIDAYS in src/sim/constants.js), so every boss
                   wears its outfit; works with the normal view, &lineup=1, &showcase=1 and &bosses=1
    &bosses=1      the boss's holiday outfit (with &holiday=..., else his suit), large: the four ranks
                   walking right, walking left, mid pep talk and storming off, then a row of all
                   four at the game's normal zoom (40 px a tile) and one at 16 px a tile, zoomed out
                   (each drawn small and then enlarged, as the screen would show it). &zoom= scales
                   the big rows.
    &cardshow=puppies  the cards that change how shoppers behave (0.3.01), each in a frozen scene on
                   the small map like &showcase=1 (with its effects shown again every &every=1500 ms):
                   puppies (spayed: pregnant dogs, a litter, the pop and the laser stopping one),
                   booze (eightyproof and warranty: a plain and a booze sample table, a shopper just
                   turned drunk, sales at the stands), support (supportdog and eyesup: support dogs
                   walking, bolting and sitting, shoppers petting, a guide dog beside them, a dad
                   trailing an Exhibitionist), boss (bde: the bigger bosses beside ordinary
                   shoppers), mess (slushie: a wide mess, one against a wall and a crate, and a
                   plain one). The card is forced; &cards=a,b forces another hand
    &cards=a,b     the game's hand (any card ids), with no deal
    &allfx=1       inject one of every effect event every &every=1200 ms at fixed places
    &zoom=1.6&at=24,7   close-up: that many times the whole-map zoom, centred on that tile
    &magnify=3     draw the game into a window a third the size and show it three times bigger,
                   pixel for pixel, to judge small zooms (cam=x,y,16) by eye in a screenshot
  Debugging and stress tests:
    &freeze=1      do not run the game after the fast-forward (still drawn every frame)
    &frames=N      stop the game and drawing after N frames
    &keep=dad,karen  keep only these shopper kinds; &fx=spray,shot  keep only these pending events
    &clone=150     copy shoppers up to this many; &fill=300  scatter buildings up to this many
    &bench=N       draw N frames back to back (forcing rasterisation) and print ms per frame
  Keys: 1-7 pick a building (the game's hotkeys: Crates, Sprinkler, Forklift, Laser, Wet Floor,
        Samples, Salesman), g Barcode Laser, t TV Salesman, x remove, Esc no tool, r rotate.
        Click places.
        WASD or arrow keys pan, mouse wheel or +/- zooms, f fits the whole map, m toggles the minimap.
  Errors are printed in big red text on the page. Note: headless Edge screenshots (tools/shot.ps1)
  tend to capture an early frame, so effects show at the moment they start; use &lineup=1 to see
  them part way through.
-->
</head>
<body>
<canvas id="c"></canvas>
<canvas id="mag" style="display:none; position:fixed; left:0; top:0; width:100vw; height:100vh; image-rendering:pixelated"></canvas>
<canvas id="mini"></canvas>
<div id="err"></div>
<div id="stats"></div>
<script>
  // Show any uncaught error in big red text, so a screenshot shows it.
  const showErr = (msg) => { document.getElementById('err').textContent += msg + '\n'; };
  addEventListener('error', (e) => showErr('ERROR: ' + (e.error && e.error.stack || e.message)));
  addEventListener('unhandledrejection', (e) => showErr('ERROR: ' + (e.reason && e.reason.stack || e.reason)));
</script>
<script type="module">
import { HostSession } from '../src/net/session.js';
import { createDirector } from '../src/content/director.js';
import {
  applyDemoLayout, applyCommand, addPlayer, createGame, BUILD, TUNE, TICK_HZ, ST, itemCode, takesSupply, addStock,
  statsOf, tilesOf, rebuildDeal, idShare, CARDS,
} from '../src/sim/index.js';
import { createRenderer } from '../src/render/renderer.js';
import { createMinimap } from '../src/render/minimap.js';

const q = new URLSearchParams(location.search);
const num = (k, d) => (q.has(k) && q.get(k) !== '' ? Number(q.get(k)) : d);
const canvas = document.getElementById('c');
// &magnify=N: the game canvas is 1/N of the window, copied N times bigger onto #mag every frame.
const MAG = Math.max(1, num('magnify', 1) | 0);
const magCanvas = document.getElementById('mag');
if (MAG > 1) {
  canvas.style.width = `${100 / MAG}vw`;
  canvas.style.height = `${100 / MAG}vh`;
  canvas.style.visibility = 'hidden';
  magCanvas.style.display = 'block';
}
function magnify() {
  if (MAG <= 1) return;
  magCanvas.width = canvas.width * MAG;
  magCanvas.height = canvas.height * MAG;
  const m = magCanvas.getContext('2d');
  m.imageSmoothingEnabled = false;
  m.drawImage(canvas, 0, 0, magCanvas.width, magCanvas.height);
}
/** &cardshow=: which scene, and the cards each forces. */
const CARDSHOW = q.get('cardshow');
const CARDSHOW_HANDS = { puppies: ['spayed'], booze: ['eightyproof', 'warranty'], support: ['supportdog', 'eyesup'], boss: ['bde'], mess: ['slushie'] };
/** &showcase=1, and the mom in it who leaves her cart behind a moment after it starts. */
const SHOW = { on: q.get('showcase') === '1' || !!CARDSHOW, lateMom: null };
/** &pop=sprinkler|laser: the events of the moment she popped (or did not), shown again and again. */
const POP = { on: q.has('pop'), laser: q.get('pop') === 'laser', events: null, note: '' };
/** A building's facing (0 east, 1 south, 2 west, 3 north) for a direction in tiles. */
const DIR_OF = (dx, dy) => (dx > 0 ? 0 : dy > 0 ? 1 : dx < 0 ? 2 : 3);

let session;
if (q.get('null') === '1') {
  session = { state: null, me: 0, drainFx: () => [], alpha: () => 0, start() {} };
} else {
  const map = q.has('design') || q.has('size') ? { design: q.get('design') || 'warehouse', size: q.get('size') || 'xs' } : null;
  const cards = q.has('cards') ? q.get('cards').split(',') : CARDSHOW ? CARDSHOW_HANDS[CARDSHOW] || null : null;
  const state = createGame({ seed: num('seed', 7), map, holiday: q.get('holiday'), cards });
  session = new HostSession({ name: 'Dave', director: createDirector(), state });
  const s = session.state;
  const me = s.players[0];
  const names = ['Steve', 'Kev', 'Big Gaz', 'Tommo', 'Dazza'];
  for (let n = 1; n < num('players', 1) && n < 6; n++) addPlayer(s, names[n - 1]);
  if (q.get('cursors') === '1' && s.players.length < 3) { addPlayer(s, 'Steve'); addPlayer(s, 'Kev'); }
  const place = (k, x, y, d) => applyCommand(s, 0, { c: 'place', k, x, y, d });
  const showcase = SHOW.on;
  if (q.get('demo') !== '0' && !showcase && !POP.on) {
    const problems = applyDemoLayout(s, 0);
    if (problems.length) console.warn('demo layout:', problems.length, 'pieces did not fit');
  }
  if (q.get('extra') === '1') {
    me.cash += 5000;
    const E = 0, S = 1, Wd = 2, N = 3;
    const extra = [
      ['crate', 25, 2, 0], ['crate', 26, 2, 0], ['crate', 2, 13, 0], ['crate', 3, 13, 0],
      ['samples', 17, 12, 0],
      // The big ones: a Barcode Laser lying east-west, one north-south, and a TV Salesman.
      // (The east-west one at 14,12: one row up, it would stand on the demo Back's Clearance Bin.)
      ['railgun', 14, 12, E], ['railgun', 24, 10, N], ['salesman', 17, 1, 0],
    ];
    for (const [k, x, y, d] of extra) {
      const r = place(k, x, y, d);
      if (!r.ok) console.warn('extra', k, x, y, r.why);
    }
    // On The Back (f: 1): a right-turning loop in the top-right corner and a left-turning line
    // lower down on the left, each starting at a Splitter and ending in a Clearance Bin.
    const back = [
      ['split', 24, 1, E], ['conv', 25, 1, E], ['conv', 26, 1, E], ['conv', 27, 1, S], ['conv', 27, 2, S],
      ['conv', 27, 3, Wd], ['conv', 26, 3, Wd], ['conv', 25, 3, Wd], ['bin', 24, 3, 0],
      ['split', 1, 8, S], ['conv', 1, 9, S], ['conv', 1, 10, E], ['conv', 2, 10, E], ['conv', 3, 10, N],
      ['conv', 3, 9, N], ['bin', 3, 8, 0],
    ];
    for (const [k, x, y, d] of back) {
      const r = applyCommand(s, 0, { c: 'place', k, x, y, d, f: 1 });
      if (!r.ok) console.warn('extra (The Back)', k, x, y, r.why);
    }
  }
  // &wall=3  a wall of crate stacks down column 3 (gap in the top row): gym bros smash through it
  if (q.has('wall')) {
    me.cash += 5000;
    for (let y = 2; y < s.h - 1; y++) place('crate', num('wall', 3), y, 0);
  }
  // &fill=300  scatter Crate Stacks and security over free floor until there are this many buildings
  if (q.has('fill')) {
    const kinds = ['crate', 'crate', 'crate', 'sprinkler', 'crate', 'forklift', 'samples', 'wetfloor'];
    let count = s.grid.filter(Boolean).length;
    for (let i = 0; i < s.grid.length && count < num('fill', 300); i++) {
      if (s.tiles[i] !== '.' || s.grid[i] || (i * 7) % 5 === 0) continue;
      const k = kinds[i % kinds.length];
      s.grid[i] = { k, o: 0, d: i % 4, t: 10, n: 1, out: 0, cd: 0, a: i };
      count++;
    }
  }
  if (CARDSHOW) buildCardShow(s, me);
  else if (showcase) buildShowcase(s, me);
  // The anchor tiles of every building (the other tiles of a big one only point at it).
  const anchors = () => s.grid.map((b, i) => (b && b.part === undefined ? i : -1)).filter((i) => i >= 0);
  // &stock=1  stock every security building, a different mix of supplies and tiers on each (as if
  // they had come up its Dumbwaiter: takesSupply keeps to what it takes and the cap)
  if (q.get('stock') === '1') {
    anchors().forEach((i, n) => {
      const b = s.grid[i];
      for (let type = 1; type <= 5; type++) {
        const tier = (n + type * 2) % 5;
        for (let u = 0; tier && u < 2 && takesSupply(b, itemCode(type, tier)); u++) addStock(b, itemCode(type, tier));
      }
    });
  }
  // &damage=1  every other building hit by gym bros: once, or down to its last hit
  if (q.get('damage') === '1') {
    anchors().forEach((i, n) => {
      const b = s.grid[i], hits = statsOf(b).hits;
      if (n % 2 || hits < 2) return;
      b.hit = n % 4 ? hits - 1 : 1;
    });
  }
  // &off=1  every other piece of security switched off (a stray dog peed on it)
  if (q.get('off') === '1') {
    anchors().filter((i) => BUILD[s.grid[i].k].group === 'security' && s.grid[i].k !== 'wetfloor')
      .forEach((i, n) => { if (!(n % 2)) s.grid[i].off = 99999; });
  }
  // &rubble=1  wreck every seventh building, leaving rubble as the rules do; every other wreck is
  // ordered (paid for with the Rebuild button and waiting: by and res, 0.3.04) and wears a cone
  if (q.get('rubble') === '1') {
    let w = 0;
    anchors().forEach((i, n) => {
      if (n % 7) return;
      const b = s.grid[i];
      const r = { i, k: b.k, d: b.d | 0, o: b.o };
      if (b.c !== undefined) r.c = b.c;
      if (w++ % 2) { r.by = b.o; r.res = rebuildDeal(r, Infinity).pay; }
      s.rubble.push(r);
      for (const t of tilesOf(s, i)) s.grid[t] = 0;
    });
    s.gridVer++;
  }
  // &cash=5000  the player's money (so a preview can show green for something expensive)
  if (q.has('cash')) me.cash = num('cash', 400);
  if (q.has('wave')) s.wave = Math.max(0, num('wave', 1) - 1);
  else if (POP.on) s.wave = 13;
  if (POP.on) {
    me.cash += 1e5;
    // Three tiles inside the first entrance: a sprinkler beside the route, or a Barcode Laser a
    // few tiles to one side, facing across the route so its beam crosses it (as in
    // test/preggo.test.js). Works on any design and size: the first spot the rules accept is used.
    const door = s.doors[0], W = s.w;
    const dx = door.reduce((a, i) => a + (i % W), 0) / door.length, dy = door.reduce((a, i) => a + ((i / W) | 0), 0) / door.length;
    const [ix, iy] = dx < 1 ? [1, 0] : dx > W - 2 ? [-1, 0] : dy < 1 ? [0, 1] : [0, -1]; // inward
    const [px, py] = [-iy, ix]; // along the wall
    const ax = Math.round(dx + ix * 3), ay = Math.round(dy + iy * 3);
    const tries = POP.laser
      ? [3, 4, 5, 6].flatMap((o) => [-1, 1].map((sd) => [ax + px * o * sd, ay + py * o * sd, DIR_OF(-px * sd, -py * sd)]))
      : [-1, 1, 0, -2, 2].map((o) => [ax + px * o, ay + py * o, 0]);
    const done = tries.find(([x, y, d]) => place(POP.laser ? 'railgun' : 'sprinkler', x, y, d).ok);
    if (!done) showErr('pop: could not place a ' + (POP.laser ? 'Barcode Laser' : 'sprinkler') + ' near the entrance');
  }
  if (q.get('nostart') !== '1') session.send({ c: 'start' });
  session.fastForward(num('ff', 0));
  if (CARDSHOW) cardShowCrowd(s);
  else if (showcase) showcaseCrowd(s);
  if (POP.on) stagePop(s);
  // &supers=1  every third shopper becomes a super one
  if (q.get('supers') === '1') s.shoppers.forEach((sh, n) => { if (n % 3 === 0) sh.sup = 1; });
  // &fx=spray,shot  only pass these event types to the renderer (debugging); fx=none drops them all
  if (q.has('fx')) {
    const allow = q.get('fx').split(',');
    session.fx = session.fx.filter((e) => allow.includes(e.e));
  }
  // &clone=150  copy shoppers until there are this many (stress test, use with freeze=1)
  if (q.has('clone') && s.shoppers.length) {
    const want = num('clone', 150), src = s.shoppers.slice();
    for (let k = 0; s.shoppers.length < want; k++) {
      const o = src[k % src.length];
      s.shoppers.push({ ...o, id: 10000 + k, x: 1.5 + ((k * 7.3) % (s.w - 3)), y: 1.5 + ((k * 3.1) % (s.h - 3)), sup: k % 9 === 0 ? 1 : o.sup });
    }
  }
  // &keep=dad,karen  keep only these shopper kinds (debugging)
  if (q.has('keep')) {
    const keep = q.get('keep').split(',');
    s.shoppers = s.shoppers.filter((sh) => keep.includes(sh.k));
  }
}

const renderer = createRenderer(canvas, session);
addEventListener('resize', () => renderer.resize());
// For poking at from the browser console (or a test script): window.harness.renderer.cam etc.
window.harness = { renderer, session };
// &cam=x,y,zoom  /  &fitview=1  /  &zoom=Z&at=x,y
if (q.get('fitview') === '1') renderer.fit();
if (q.has('cam')) {
  const [cx, cy, cz] = q.get('cam').split(',').map((v) => (v === '' ? NaN : Number(v)));
  if (cz > 0) renderer.zoomBy(cz / renderer.cam.zoom);
  renderer.centerOn(Number.isFinite(cx) ? cx : renderer.cam.x, Number.isFinite(cy) ? cy : renderer.cam.y);
}
if (q.has('zoom') && q.get('lineup') !== '1') {
  renderer.fit();
  renderer.zoomBy(num('zoom', 2));
  const [ax, ay] = (q.get('at') || '15,8').split(',').map(Number);
  renderer.centerOn(ax + 0.5, ay + 0.5);
}

// Minimap in the corner.
const miniCanvas = document.getElementById('mini');
const mini = createMinimap(miniCanvas, session, renderer);
let miniOn = q.get('mini') === '1';
const showMini = () => { miniCanvas.style.display = miniOn ? 'block' : 'none'; if (miniOn) mini.draw(); };
showMini();
setInterval(() => { if (miniOn) mini.draw(); }, 250);
miniCanvas.addEventListener('mousedown', (e) => {
  const t = mini.tileAt(e.clientX, e.clientY);
  if (t) { renderer.centerOn(t.x + 0.5, t.y + 0.5); mini.draw(); }
});

// The game's hotkeys, 1 to 7 in the build bar's order.
const tools = ['crate', 'sprinkler', 'forklift', 'railgun', 'wetfloor', 'samples', 'salesman'];
const view = {
  floor: num('floor', 0) === 1 ? 1 : 0,
  tool: q.get('tool') || null,
  dir: num('dir', 0),
  hover: q.has('hx') ? { x: num('hx', 0), y: num('hy', 0) } : null,
  cursors: new Map(),
  route: q.get('route') === '1',
};
const fixedHover = q.has('hx');
canvas.addEventListener('mousemove', (e) => { if (!fixedHover) view.hover = renderer.tileAt(e.clientX, e.clientY); });
canvas.addEventListener('mouseleave', () => { if (!fixedHover) view.hover = null; });
canvas.addEventListener('click', (e) => {
  const t = renderer.tileAt(e.clientX, e.clientY);
  if (!t || !session.send) return;
  const f = view.floor === 1 ? { f: 1 } : {};
  if (view.tool === 'remove') session.send({ c: 'remove', x: t.x, y: t.y, ...f });
  else if (BUILD[view.tool]) session.send({ c: 'place', k: view.tool, x: t.x, y: t.y, d: view.dir, ...f });
});
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  renderer.zoomBy(Math.exp(-e.deltaY * 0.0015), e.clientX, e.clientY);
}, { passive: false });
const held = new Set();
addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (e.key >= '1' && e.key <= String(tools.length)) view.tool = tools[Number(e.key) - 1];
  else if (k === 'g') view.tool = 'railgun';
  else if (k === 't') view.tool = 'salesman';
  else if (k === 'x') view.tool = 'remove';
  else if (e.key === 'Escape') view.tool = null;

  // At a real size: drawn into a small canvas at that many pixels a tile, then enlarged, so the
  // picture shows what a player would see on screen, only bigger.
  const small = document.createElement('canvas');
  const smallSprites = createShopperSprites();
  const R = { st: ST.WALK, vx: 0.05 };
  const POSES = [[R, 1], [R, -1], [{ ...R, pp: 9999 }, 1], [{ st: ST.LEAVE, vx: 0, t: 30 }, 1]];
  const who = (tr, pose) => ({ id: tr * 7, k: 'boss', sup: 0, x: 0, y: 0, vy: 0, hp: 20, mhp: 30, t: 20, cd: 0, kd: 0, bt: 0, tr, pp: 0, ...pose });
  const draw = (t) => {
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.fillStyle = '#8d9093';
    g.fillRect(0, 0, canvas.width, canvas.height);
    const F = { time: t / 1000, now: t, alpha: 0, dress: holiday, zoom: 40 };
    g.setTransform(big, 0, 0, big, 0, 0);
    // Rows: the four poses. Columns: the four ranks.
    POSES.forEach(([pose, f], r) => {
      for (let tr = 1; tr <= 4; tr++) {
        const sh = who(tr, pose);
        const x = 72 + (tr - 1) * 112, y = 120 + r * 122;
        drawShopper(g, sh, x, y, f, F, sprites);
        if (r === 0) drawBossTag(g, sh, x, y, F);
      }
    });
    // Real sizes, to the right: 40 and 16 pixels a tile (the screen at the game's usual zoom, and
    // zoomed out).
    g.setTransform(1, 0, 0, 1, 0, 0);
    let y0 = 40;
    const x0 = 470 * big;
    for (const [px, enlarge] of [[40, 1.6], [16, 3]]) {
      const z = px / 40, w = 4 * 92, h = 130;
      small.width = Math.ceil(w * z); small.height = Math.ceil(h * z);
      smallSprites.setScale(z);
      const sg = small.getContext('2d');
      sg.setTransform(z, 0, 0, z, 0, 0);
      sg.fillStyle = '#8d9093'; sg.fillRect(0, 0, w, h);
      for (let tr = 1; tr <= 4; tr++) {
        const sh = who(tr, R);
        drawShopper(sg, sh, 46 + (tr - 1) * 92, 112, 1, { ...F, zoom: px }, smallSprites);
        // (Zoomed out, the name plates grow to stay readable and would cover each other here.)
        if (px === 40) drawBossTag(sg, sh, 46 + (tr - 1) * 92, 112, { ...F, zoom: px });
      }
      g.imageSmoothingEnabled = false;
      g.drawImage(small, x0, y0, small.width * enlarge, small.height * enlarge);
      g.textAlign = 'left'; g.textBaseline = 'alphabetic';
      g.fillStyle = '#fff'; g.font = '16px Consolas, monospace';
      g.fillText(`${px} px a tile, shown x${enlarge}`, x0, y0 + small.height * enlarge + 18);
      y0 += small.height * enlarge + 40;
    }
    g.textAlign = 'left'; g.textBaseline = 'alphabetic';
    g.fillStyle = '#fff'; g.font = 'bold 22px Segoe UI, Arial';
    g.fillText(`holiday: ${holiday || 'none'}`, x0, canvas.height - 20);
  };
  const loop = (t) => { draw(t); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
  session.stop && session.stop();
} else if (q.has('bench')) {
  // Draw N frames back to back and print the average, for measuring in headless Edge.
  const N = num('bench', 50);
  renderer.draw(view);
  const t0 = performance.now();
  const g0 = canvas.getContext('2d');
  for (let k = 0; k < N; k++) { renderer.draw(view); g0.getImageData(0, 0, 1, 1); } // getImageData forces the drawing to be rasterised now
  const ms = (performance.now() - t0) / N;
  const st = session.state;
  stats.textContent = `bench ${ms.toFixed(2)} ms/frame` + (st ? `  shoppers ${st.shoppers.length}  phase ${st.phase}  tick ${st.tick}  refunds ${st.refunds}  zoom ${renderer.cam.zoom.toFixed(1)}` : '');
  document.title = stats.textContent;
  session.stop();
} else {
  requestAnimationFrame(frame);
}

// --- &pop= ---------------------------------------------------------------------------------------

/**
 * One Pregnant Lady (an Octomom with &octo=1) walks in with one patience left; the game runs tick by
 * tick until she pops or a Barcode Laser stops it, then &after more ticks. Keeps that moment's
 * 'left' and 'pop' / 'nopop' events in POP.events and a line saying what happened in POP.note.
 */
function stagePop(s) {
  s.shoppers.length = 0;
  s.spawnQ = [[s.tick + 1, 'preggo', q.get('octo') === '1' ? 1 : 0, -1]];
  for (let n = 0; n < 40 * TICK_HZ && !POP.events; n++) {
    session.fastForward(1);
    const her = s.shoppers.find((m) => m.k === 'preggo');
    if (her && her.hp > 1) her.hp = 1;
    const ev = session.fx.slice(-12);
    const at = ev.findIndex((e) => e.e === 'pop' || e.e === 'nopop');
    if (at >= 0) POP.events = ev.filter((e) => e.e === 'pop' || e.e === 'nopop' || (e.e === 'left' && e.k === 'preggo'));
  }
  if (!POP.events) { POP.note = `pop: she never ran out of patience (phase ${s.phase}, tick ${s.tick})`; return; }
  session.fastForward(num('after', 12));
  const p = POP.events.find((e) => e.e !== 'left');
  const babies = s.shoppers.filter((m) => m.k === 'baby').length;
  POP.note = `${p.e} at ${p.x.toFixed(2)},${p.y.toFixed(2)} (tick ${s.tick}): ${p.e === 'pop' ? p.n + ' babies' : 'no babies'}, ${babies} on the floor`;
}

// --- &showcase=1 ---------------------------------------------------------------------------------

/** The new buildings in every state, top half of the small map (placed by the rules, then set). */
function buildShowcase(s, me) {
  me.cash += 1e7;
  const E = 0, S = 1, Wd = 2, N = 3;
  const at = (x, y) => y * s.w + x;
  const put = (k, x, y, d = 0, set = {}) => {
    const r = applyCommand(s, 0, { c: 'place', k, x, y, d });
    if (!r.ok) { console.warn('showcase', k, x, y, r.why); return null; }
    const b = s.grid[at(x, y)];
    Object.assign(b, set);
    return b;
  };
  // Barcode Lasers facing each way: charged, half charged, just fired, switched off. (Their charge
  // is set again after the doors open, by showcaseCrowd.)
  put('railgun', 2, 1, E, { cd: 0 });
  SHOW.half = put('railgun', 2, 3, Wd);
  SHOW.fired = put('railgun', 6, 1, N);
  put('railgun', 8, 1, S, { off: 99999 });
  // Barcode Laser with one hit left (smoke), stocked with Extension Cord and Bottled Spite (runs of
  // [tier, uses], as back.js keeps them).
  put('railgun', 2, 5, E, { cd: 0, s: { rng: [2, 2], dmg: [1, 2] }, hit: 1 });
  // TV Salesmen: working, switched off, and damaged once.
  put('salesman', 11, 1);
  put('salesman', 14, 1, 0, { off: 99999 });
  put('salesman', 25, 1, 0, { hit: 1, s: { dur: [1, 1] } });
  // Stocked, damaged and switched-off smaller things. (Crate Stacks have no stock and go at one
  // hit, so they are shown whole.)
  put('sprinkler', 17, 2, 0, { s: { dmg: [2, 20], rng: [1, 20] }, off: 99999 });
  put('forklift', 19, 2, 0, { s: { spd: [3, 6], dur: [2, 2] } });
  put('crate', 21, 2, 0);
  put('crate', 22, 2, 0);
  put('crate', 23, 2, 0);
  for (let x = 15; x < 20; x++) put('crate', x, 4, 0);
  put('forklift', 24, 5, 0, { off: 99999 });
  put('samples', 26, 5, 0, { off: 99999, s: { rng: [1, 8] } });
  // Rubble of a Barcode Laser that faced north, and of a salesman.
  s.rubble.push({ i: at(10, 4), k: 'railgun', d: N, o: 0 });
  s.rubble.push({ i: at(12, 5), k: 'salesman', d: 0, o: 0 });
  me.cash = 400;
}

/** Every new shopper in every state, in the bottom half (after the wave has started). */
function showcaseCrowd(s) {
  const full = (b) => Math.round(statsOf(b).cd * TICK_HZ);
  if (SHOW.half) SHOW.half.cd = full(SHOW.half) / 2;
  if (SHOW.fired) SHOW.fired.cd = full(SHOW.fired) - 3;
  s.shoppers.length = 0;
  s.spawnQ.length = 0;
  let id = 100;
  const add = (k, x, y, o = {}) => {
    const sh = { id: id++, k, sup: 0, x, y, vx: 0, vy: 0, hp: 30, mhp: 40, st: ST.WALK, t: 0, cd: 0, ox: 0, oy: 0, lt: -1, ...o };
    s.shoppers.push(sh);
    return sh;
  };
  const walkR = { vx: 0.05 }, walkL = { vx: -0.05 };
  const watch = { st: ST.WATCH, t: 9999 };
  // Dogs: walking, peeing on the switched-off sprinkler (17,2) and barcode laser (8,1-3), watching TV.
  add('dog', 2.5, 7.6, walkR);
  add('dog', 18.75, 2.75, watch);
  add('dog', 10.1, 3.6, { ...watch, sup: 1 });
  add('dog', 12.6, 4.4, watch);
  add('dog', 5.5, 7.6, { ...walkL, sup: 1 });
  // The boss at all four tiers (the CEO in the middle of a pep talk).
  add('boss', 8.6, 7.7, { ...walkR, tr: 1, pp: 100, mhp: 400, hp: 300 });
  add('boss', 11.8, 7.7, { ...walkR, tr: 2, pp: 100, mhp: 600, hp: 200 });
  add('boss', 15.2, 7.7, { ...walkL, tr: 3, pp: 100, mhp: 800, hp: 700 });
  add('boss', 19.6, 7.7, { tr: 4, pp: 99999, mhp: 1000, hp: 450 });
  // A hunter watching the salesman's television, one hurrying past him.
  add('hunter', 13.6, 3.6, watch);
  add('hunter', 23.5, 7.4, { ...walkR, ru: 40 });
  // Cosplayers: the four costumes (by id), and the mech suit.
  id = 200;
  for (let n = 0; n < 4; n++) add('cosplay', 2.5 + n * 2.3, 10.2, n % 2 ? walkL : walkR);
  add('cosplay', 12, 10.2, { ...walkR, sup: 1 });
  // Exhibitionist with the robe shut, then open with a dad and a teenager staring; Nudist Nan.
  add('flasher', 14.5, 9.6, walkR);
  add('flasher', 17.5, 9.6, { ...watch, fl: 40 });
  add('dad', 19.4, 9.7, watch);
  add('teen', 16, 10.4, { ...watch, gz: 60 });
  add('flasher', 22.5, 9.6, { ...walkL, sup: 1 });
  add('flasher', 25.5, 9.6, { ...watch, sup: 1, fl: 40 });
  // Day drinkers: walking fast, face down, the Bruncher dawdling and face down.
  add('drinker', 2.5, 13.5, { ...walkR, sv: 1.7 });
  add('drinker', 5.5, 13.5, { st: ST.STUN, t: 80 });
  add('drinker', 8.5, 13.5, { ...walkL, sup: 1, sv: 0.6 });
  add('drinker', 11.5, 13.5, { st: ST.STUN, t: 160, sup: 1 });
  // Moms: cart, chasing her child, child waiting, carrying him, crawling with her cart (a Soccer
  // Mom's first time down) and without it (the cart is left behind where she went down).
  add('mom', 14.5, 12.4, { ...walkR, kd: 0 });
  add('mom', 16.6, 12.4, { ...walkR, kd: 1, kx: 18.4, ky: 12.5, kvx: 0.12, kvy: 0 });
  add('mom', 21.2, 12.4, { kd: 2, kx: 22.6, ky: 12.3, kvx: 0, kvy: 0 });
  add('mom', 25, 12.4, { ...walkR, kd: 3, nc: 1 });
  add('mom', 14.6, 14.3, { ...walkR, kd: 2, kx: 17.4, ky: 14.4, kvx: 0, kvy: 0, cr: 1, hp: 0, sup: 1, nc: 0 });
  SHOW.lateMom = add('mom', 21.6, 14.3, { ...walkR, kd: 2, kx: 24.8, ky: 14.3, kvx: 0, kvy: 0, cr: 1, hp: 0, nc: 0 });
}

// --- &cardshow= ----------------------------------------------------------------------------------

/** The first id from `from` that a card picks (or, with inShare false, leaves out). */
function idFor(card, inShare = true, from = 100) {
  // (session.state: the game's `state` is a const inside the block that makes it, out of reach here.)
  for (let id = from; ; id++) if ((idShare(id, card, session.state.seed) < CARDS[card].share) === inShare) return id;
}

/** The buildings of a &cardshow= scene. */
function buildCardShow(s, me) {
  me.cash += 1e7;
  const at = (x, y) => y * s.w + x;
  const put = (k, x, y, d = 0, set = {}) => {
    const r = applyCommand(s, 0, { c: 'place', k, x, y, d });
    if (!r.ok) { console.warn('cardshow', k, x, y, r.why); return null; }
    return Object.assign(s.grid[at(x, y)], set);
  };
  if (CARDSHOW === 'booze') {
    // A plain table and a booze table side by side, and a TV Salesman.
    const plain = put('samples', 9, 6), booze = put('samples', 14, 6);
    if (plain) delete plain.bz;
    if (booze) booze.bz = 1;
    put('salesman', 22, 5);
  }
  if (CARDSHOW === 'puppies') put('railgun', 14, 12, 0);
  if (CARDSHOW === 'mess') put('crate', 6, 6);
  me.cash = 400;
}

/** The shoppers (and messes, and effects) of a &cardshow= scene, after the doors open. */
function cardShowCrowd(s) {
  s.shoppers.length = 0;
  s.spawnQ.length = 0;
  const W = s.w;
  let id = 1000;
  const add = (k, x, y, o = {}) => {
    const sh = { id: id++, k, sup: 0, x, y, vx: 0, vy: 0, hp: 30, mhp: 40, st: ST.WALK, t: 0, cd: 0, ox: 0, oy: 0, lt: -1, ...o };
    s.shoppers.push(sh);
    return sh;
  };
  const walkR = { vx: 0.05 }, walkL = { vx: -0.05 };
  const watch = { st: ST.WATCH, t: 99999 };
  const ev = (SHOW.events = []);
  if (CARDSHOW === 'puppies') {
    // Pregnant dogs (walking, sitting, a Great Dane), an ordinary one beside them, and a litter.
    add('dog', 4.5, 4.6, { ...walkR, id: idFor('spayed') });
    add('dog', 7.3, 5.6, { ...watch, id: idFor('spayed', true, 2000) });
    add('dog', 13, 4.8, { ...walkR, sup: 1, id: idFor('spayed', true, 3000) });
    add('dog', 18, 4.6, { ...walkL, id: idFor('spayed', false) });
    for (let n = 0; n < 5; n++) add('pup', 4 + n * 1.15 + (n % 2) * 0.3, 9.4 + (n % 2) * 0.5, { ...walkR, id: 40 + n, hp: 4, mhp: 7 });
    for (let n = 0; n < 8; n++) add('pup', 13 + n * 0.9, 9.2 + (n % 3) * 0.4, { ...walkR, id: 60 + n, hp: 4, mhp: 7 });
    ev.push({ e: 'pop', x: 6, y: 13, n: 5, sup: 0, pup: 1 }, { e: 'nopop', x: 19.5, y: 12.5, sup: 0, pup: 1 },
      { e: 'escape', k: 'pup', sup: 0, x: W - 1.2, y: 8.5, refund: 5, n: 0 }, { e: 'left', k: 'pup', sup: 0, x: 15, y: 13, by: 0, why: 'annoyed' });
  }
  if (CARDSHOW === 'booze') {
    add('hunter', 9.5, 8.2, { st: ST.BROWSE, t: 99999 });
    add('clipper', 14.5, 8.2, { st: ST.BROWSE, t: 99999, bq: 1 });
    add('drinker', 16.8, 8.6, { ...walkR, sv: 1.4 });
    add('hunter', 22.3, 7.8, watch);
    ev.push({ e: 'drunk', x: 16.8, y: 8.6, k: 'hunter', sup: 0 }, { e: 'bought', i: 6 * W + 9, k: 'samples', v: 50, x: 9.5, y: 6.5, by: 'hunter' },
      { e: 'bought', i: 5 * W + 22, k: 'salesman', v: 270, x: 23, y: 6, by: 'hunter' });
  }
  if (CARDSHOW === 'support') {
    const esa = idFor('supportdog');
    add('blind', 5.5, 5.5, { ...walkR, bt: 0, id: esa });
    add('hunter', 6.4, 6.4, { ...watch, pd: esa, id: 3 });
    add('karen', 4.6, 6.4, { ...watch, pd: esa, id: 4 });
    add('blind', 13.5, 5.5, { ...walkR, bt: 30, id: idFor('supportdog', true, esa + 1) });
    add('blind', 21.5, 5.5, { st: ST.STUN, t: 99999, id: idFor('supportdog', true, esa + 300) });
    add('blind', 5.5, 9.7, { ...walkR, bt: 0, id: idFor('supportdog', false) });
    // A dad trailing an Exhibitionist, and one who is not.
    const her = add('flasher', 16.5, 10.6, { ...walkR, id: 20 });
    add('dad', 14.6, 10.6, { ...walkR, ex: her.id, id: idFor('eyesup') });
    add('dad', 21.5, 12.6, { ...walkR, id: idFor('eyesup', false) });
    ev.push({ e: 'pet', x: 5.5, y: 5.5, n: 2, k: 'hunter' }, { e: 'trail', x: 14.6, y: 10.6 }, { e: 'bolt', x: 13.5, y: 5.5 });
  }
  if (CARDSHOW === 'boss') {
    add('boss', 6.5, 7.7, { ...walkR, tr: 1, pp: 100, mhp: 400, hp: 300 });
    add('hunter', 9, 7.9, walkR);
    add('dad', 3.8, 8, walkR);
    add('boss', 15.5, 7.7, { tr: 4, pp: 99999, mhp: 1000, hp: 450 });
    add('karen', 18.4, 8.1, walkL);
    add('dog', 12.5, 9.5, walkR);
    ev.push({ e: 'pep', x: 15.5, y: 7.7, n: 2 });
  }
  if (CARDSHOW === 'mess') {
    // As the rules lay them: a mess and the four tiles it spilt onto (a third element 1), one
    // against the top wall, one beside a crate (6,6), and a plain one without the card's spill.
    const life = Math.round(TUNE.messSecs * TICK_HZ) - 10;
    const wide = (x, y) => {
      s.messes.push([y * W + x, life]);
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const i = (y + dy) * W + x + dx;
        if (s.tiles[i] === '.' && !s.grid[i]) s.messes.push([i, life, 1]);
      }
    };
    wide(10, 8); wide(15, 1); wide(6, 7);
    s.messes.push([8 * W + 21, life]);
    add('teen', 11.6, 8.7, walkR);
    add('hunter', 9.4, 9.3, walkR);
    ev.push({ e: 'mess', i: 8 * W + 10, wide: 4 });
  }
}
