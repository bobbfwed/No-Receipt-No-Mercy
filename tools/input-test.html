<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mouse and keyboard check (test page)</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
  #log { position: fixed; left: 8px; bottom: 8px; z-index: 9; background: #000c; color: #9f9; font: 13px Consolas, monospace; padding: 6px 10px; white-space: pre; }
</style>
</head>
<body>
<!--
  A test page: loads a solo game and plays it with made-up mouse and keyboard events, the same
  events a real player produces. It builds a small production line by dragging, places security,
  rotates a belt, removes one thing with the right mouse button, and opens the doors.
  Open through the dev server: http://localhost:5173/tools/input-test.html
  The green box in the corner lists each step; the picture should show the line it built.
-->
<iframe id="game" src="../index.html?solo=1&name=Tester&seed=3&size=xs" title="Game"></iframe>
<div id="log"></div>
<script>
  const W = 30, H = 16, TILE = 40;
  const frame = document.getElementById('game');
  const log = (t) => { document.getElementById('log').textContent += t + '\n'; };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  frame.addEventListener('load', async () => {
    const win = frame.contentWindow, doc = frame.contentDocument;
    await wait(600);
    const canvas = doc.querySelector('canvas');
    if (!canvas) { log('FAIL: no canvas'); return; }
    // Where a tile is on screen: the world is scaled to fit the canvas and centred.
    const at = (tx, ty) => {
      const r = canvas.getBoundingClientRect();
      const s = Math.min(r.width / (W * TILE), r.height / (H * TILE));
      const ox = r.left + (r.width - W * TILE * s) / 2, oy = r.top + (r.height - H * TILE * s) / 2;
      return { clientX: ox + (tx + 0.5) * TILE * s, clientY: oy + (ty + 0.5) * TILE * s };
    };
    const mouse = (type, tx, ty, button = 0) => canvas.dispatchEvent(new win.PointerEvent(type, {
      ...at(tx, ty), button, buttons: type === 'pointerup' ? 0 : 1, pointerId: 1, bubbles: true, cancelable: true,
    }));
    const key = (k, code) => win.dispatchEvent(new win.KeyboardEvent('keydown', { key: k, code: code || `Key${k.toUpperCase()}`, bubbles: true }));
    const click = (tx, ty, button = 0) => { mouse('pointermove', tx, ty); mouse('pointerdown', tx, ty, button); mouse('pointerup', tx, ty, button); };
    const drag = async (x0, y0, x1, y1) => {
      mouse('pointermove', x0, y0); mouse('pointerdown', x0, y0);
      await wait(30);
      mouse('pointermove', x1, y1); // one big jump: the game must fill in the tiles between
      await wait(30);
      mouse('pointerup', x1, y1);
    };

    key('2', 'Digit2'); click(4, 3);                 log('unpacker at 4,3 (facing east)');
    key('1', 'Digit1'); await drag(5, 3, 9, 3);      log('belt dragged 5,3 -> 9,3');
    key('3', 'Digit3'); click(10, 3);                log('press at 10,3');
    key('1', 'Digit1'); await drag(11, 3, 11, 7);    log('belt dragged 11,3 -> 11,7 (turns south)');
    key('5', 'Digit5'); click(11, 8);                log('chute at 11,8');
    key('7', 'Digit7'); click(3, 6); click(3, 9);    log('two sprinklers by the doors');
    key('8', 'Digit8'); click(6, 8);                 log('forklift at 6,8: must be REFUSED, not enough cash left');
    key('9', 'Digit9'); click(2, 7);                 log('wet floor sign at 2,7');
    key('6', 'Digit6'); click(20, 10); click(21, 10); log('two crates at 20,10 and 21,10');
    click(21, 10, 2);                                log('right-click removes the crate at 21,10');
    key('Escape', 'Escape');
    mouse('pointermove', 20, 10);
    key('1', 'Digit1'); click(15, 12);               log('single belt at 15,12');
    key('Escape', 'Escape'); mouse('pointermove', 15, 12); key('r', 'KeyR');  log('R rotates the belt at 15,12 to face south');
    key('0', 'Digit0'); mouse('pointermove', 8, 10); log('free samples selected, preview at 8,10');
    await wait(400);
    const open = [...doc.querySelectorAll('button')].find((b) => /open the doors/i.test(b.textContent));
    if (open) { open.click(); log('clicked OPEN THE DOORS'); } else log('FAIL: no OPEN THE DOORS button');
    const cash = doc.body.textContent.match(/\$\s?[\d,]+/);
    log('cash shown: ' + (cash ? cash[0] : '?') + '  (500 at start; about 22 left after building, plus sales)');
  });
</script>
</body>
</html>
