<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mouse and keyboard check (test page)</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
  #log { position: fixed; left: 8px; bottom: 8px; z-index: 9; background: #000c; color: #9f9; font: 13px Consolas, monospace; padding: 6px 10px; white-space: pre; }
</style>
</head>
<body>
<!--
  A test page: loads a solo game and plays it with made-up mouse and keyboard events, the same
  events a real player produces. In The Back (Tab) it builds a small supply line by dragging belts
  from the Returns Drop at 10,3 into a Spite Still and on into a Clearance Bin, and turns a belt
  with R; back on the shop floor it places security and Crate Stacks, removes one with the right
  mouse button, and opens the doors.
  Open through the dev server: http://localhost:5173/tools/input-test.html
  The green box in the corner lists each step; the picture shows the shop floor (The Back shows
  through faintly), and the last lines count what was built on each floor.
-->
<iframe id="game" src="../index.html?solo=1&name=Tester&seed=3&size=xs" title="Game"></iframe>
<div id="log"></div>
<script>
  const frame = document.getElementById('game');
  const log = (t) => { document.getElementById('log').textContent += t + '\n'; };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  frame.addEventListener('load', async () => {
    const win = frame.contentWindow, doc = frame.contentDocument;
    await wait(600);
    const canvas = doc.querySelector('canvas');
    if (!canvas) { log('FAIL: no canvas'); return; }
    // Where a tile is on screen.
    const at = (tx, ty) => {
      const r = canvas.getBoundingClientRect();
      const cam = win.__game.renderer.cam; // the game's own camera
      return { clientX: r.left + r.width / 2 + (tx + 0.5 - cam.x) * cam.zoom, clientY: r.top + r.height / 2 + (ty + 0.5 - cam.y) * cam.zoom };
    };
    const mouse = (type, tx, ty, button = 0) => canvas.dispatchEvent(new win.PointerEvent(type, {
      ...at(tx, ty), button, buttons: type === 'pointerup' ? 0 : 1, pointerId: 1, bubbles: true, cancelable: true,
    }));
    const key = (k, code) => win.dispatchEvent(new win.KeyboardEvent('keydown', { key: k, code: code || `Key${k.toUpperCase()}`, bubbles: true }));
    const click = (tx, ty, button = 0) => { mouse('pointermove', tx, ty); mouse('pointerdown', tx, ty, button); mouse('pointerup', tx, ty, button); };
    const drag = async (x0, y0, x1, y1) => {
      mouse('pointermove', x0, y0); mouse('pointerdown', x0, y0);
      await wait(30);
      mouse('pointermove', x1, y1); // one big jump: the game must fill in the tiles between
      await wait(30);
      mouse('pointerup', x1, y1);
    };

    // The Back's keys: 1 Belt, 5 Clearance Bin, 6 Spite Still. The shop's: 1 Crates, 2 Sprinkler,
    // 4 Barcode Laser, 5 Wet Floor, 6 Free Samples.
    key('Tab', 'Tab');                               log('Tab: The Back');
    key('1', 'Digit1'); await drag(10, 4, 10, 7);    log('belt dragged 10,4 -> 10,7 (south, from the Returns Drop at 10,3)');
    key('6', 'Digit6'); key('r', 'KeyR'); click(10, 8); log('Spite Still at 10,8, turned with R to face south');
    key('1', 'Digit1'); await drag(10, 9, 14, 9);    log('belt dragged 10,9 -> 14,9 (east)');
    key('5', 'Digit5'); click(15, 9);                log('Clearance Bin at 15,9');
    key('1', 'Digit1'); click(15, 12);               log('single belt at 15,12 (facing south, the way turned for the still)');
    key('Escape', 'Escape'); mouse('pointermove', 15, 12); key('r', 'KeyR');  log('R with nothing held turns the belt at 15,12 to face west');
    key('Tab', 'Tab');                               log('Tab: back to the shop floor');
    key('2', 'Digit2'); click(3, 6); click(3, 9);    log('two sprinklers by the doors');
    key('4', 'Digit4'); click(6, 8);                 log('Barcode Laser at 6,8: must be REFUSED, not enough cash left');
    key('5', 'Digit5'); click(2, 7);                 log('wet floor sign at 2,7');
    key('1', 'Digit1'); click(20, 10); click(21, 10); log('two crates at 20,10 and 21,10');
    click(21, 10, 2);                                log('right-click removes the crate at 21,10');
    key('Escape', 'Escape');
    key('6', 'Digit6'); mouse('pointermove', 8, 10); log('free samples selected, preview at 8,10');
    await wait(400);
    const open = [...doc.querySelectorAll('button')].find((b) => /open the doors/i.test(b.textContent));
    if (open) { open.click(); log('clicked OPEN THE DOORS'); } else log('FAIL: no OPEN THE DOORS button');
    const cash = doc.body.textContent.match(/\$\s?[\d,]+/);
    log('cash shown: ' + (cash ? cash[0] : '?') + '  (500 at start; about 217 left after building)');
    const s = win.__game.session.state, kinds = (list) => list.filter(Boolean).map((b) => b.k);
    const back = kinds(s.back).filter((k) => k !== 'drop' && k !== 'lift');
    log(`The Back: ${back.length} parts (expect 12: 10 belts counting the turned one, the still and the bin): ${[...new Set(back)].join(', ')}`);
    log(`turned belt at 15,12 faces ${s.back[12 * s.w + 15]?.d} (expect 2, west)`);
    log(`shop floor: ${kinds(s.grid).join(', ')} (expect 2 sprinklers, a wet floor sign, 1 crate)`);
  });
</script>
</body>
</html>
