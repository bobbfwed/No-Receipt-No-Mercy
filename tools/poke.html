<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poke the game (test page)</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
  #log { position: fixed; left: 6px; top: 6px; z-index: 9; background: #000c; color: #9f9; font: 11px Consolas, monospace; padding: 3px 8px; white-space: pre; pointer-events: none; }
</style>
</head>
<body>
<!--
  A test page: opens the game with the options you give and then performs a list of actions, so a
  screenshot tool can photograph screens that need a click or a key press to reach.
    tools/poke.html?u=<game options>&do=<actions separated by ;>
  Actions:  click:<css selector>   key:<key>   tile:<x>,<y>   hover:<x>,<y>   wait:<ms>   text:<button text>
            hold:<key>,<ms> (hold a key down, e.g. hold:d,800 to move the view)   wheel:<x>,<y>,<deltaY>
            set:<css selector>=<value> (choose an option in a drop-down)
            tap:<x>,<y> (a finger tap on a tile)   swipe:<x>,<y>,<x2>,<y2> (a one-finger drag between tiles)
            pick:<building or tool> (tap that build-bar button with a finger)
            fdown:<x>,<y> (put a finger down on a tile and keep it there)   fmove:<x>,<y> (slide that
            finger to another tile, still down; for a picture of a placement in progress)
            build:<kind>,<x>,<y>[,<dir>] (put a building straight into the game, to set a scene)
            js:<code> (run a line of JavaScript in the game's page, e.g. js:__game.session.state.refunds=99)
  Example:  tools/poke.html?u=solo%3D1&do=key:7;hover:8,10;click:.btn-help
  Photograph it with:  node tools/realshot.mjs "<url>" out.png 4000
  For a phone, add the size and --touch:  node tools/realshot.mjs "<url>" out.png 4000 390 844 --touch
-->
<iframe id="game" title="Game"></iframe>
<div id="log"></div>
<script>
  const q = new URLSearchParams(location.search);
  const frame = document.getElementById('game');
  const log = (t) => { document.getElementById('log').textContent += t + '\n'; };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  frame.src = `../index.html?${q.get('u') || 'solo=1'}`;
  frame.addEventListener('load', async () => {
    const win = frame.contentWindow, doc = frame.contentDocument;
    await wait(700);
    const canvas = () => doc.querySelector('canvas.world') || doc.querySelector('canvas');
    // Where a tile is on screen, from the game's own camera.
    const at = (tx, ty) => {
      const r = canvas().getBoundingClientRect();
      const cam = win.__game.renderer.cam;
      return { clientX: r.left + r.width / 2 + (tx + 0.5 - cam.x) * cam.zoom, clientY: r.top + r.height / 2 + (ty + 0.5 - cam.y) * cam.zoom };
    };
    const keyEvent = (type, k) => win.dispatchEvent(new win.KeyboardEvent(type, { key: k, code: /^\d$/.test(k) ? `Digit${k}` : `Key${k.toUpperCase()}`, bubbles: true }));
    const finger = (type, p) => canvas().dispatchEvent(new win.PointerEvent(type, { ...p, pointerType: 'touch', pointerId: 7, isPrimary: true, button: type === 'pointermove' ? -1 : 0, buttons: type === 'pointerup' ? 0 : 1, bubbles: true, cancelable: true }));
    const mouse = (type, x, y) => canvas().dispatchEvent(new win.PointerEvent(type, { ...at(x, y), button: 0, buttons: type === 'pointerup' ? 0 : 1, pointerId: 1, bubbles: true, cancelable: true }));
    let held = null; // where the finger put down with fdown is now
    // A grey disc where that finger is, so a picture shows what the finger would hide. (The page
    // is the iframe's size and place, so the game's coordinates are the page's.)
    const fingerDot = document.createElement('div');
    fingerDot.style.cssText = 'position:fixed;z-index:8;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(214,180,160,0.85);border:2px solid rgba(0,0,0,0.5);pointer-events:none;display:none';
    document.body.append(fingerDot);
    const showFinger = (p) => { fingerDot.style.left = `${p.clientX}px`; fingerDot.style.top = `${p.clientY}px`; fingerDot.style.display = 'block'; };
    for (const step of (q.get('do') || '').split(';').filter(Boolean)) {
      const [verb, ...rest] = step.split(':');
      const arg = rest.join(':');
      if (verb === 'wait') await wait(Number(arg) || 300);
      else if (verb === 'click') { const el = doc.querySelector(arg); if (el) el.click(); else log('no element ' + arg); }
      else if (verb === 'text') { const el = [...doc.querySelectorAll('button')].find((b) => b.textContent.trim().toLowerCase().startsWith(arg.toLowerCase())); if (el) el.click(); else log('no button ' + arg); }
      else if (verb === 'set') { const [sel, val] = arg.split('='); const el = doc.querySelector(sel); if (el) { el.value = val; el.dispatchEvent(new win.Event('change', { bubbles: true })); } else log('no element ' + sel); }
      else if (verb === 'key') keyEvent('keydown', arg);
      else if (verb === 'hold') { const [k, ms] = arg.split(','); keyEvent('keydown', k); await wait(Number(ms) || 500); keyEvent('keyup', k); }
      else if (verb === 'wheel') { const [x, y, d] = arg.split(',').map(Number); canvas().dispatchEvent(new win.WheelEvent('wheel', { ...at(x, y), deltaY: d, bubbles: true, cancelable: true })); }
      else if (verb === 'tap' || verb === 'swipe') {
        const [x, y, x2 = x, y2 = y] = arg.split(',').map(Number);
        finger('pointerdown', at(x, y));
        const a = at(x, y), b = at(x2, y2), n = Math.max(1, Math.ceil(Math.hypot(b.clientX - a.clientX, b.clientY - a.clientY) / 8));
        for (let k = 1; k <= n && verb === 'swipe'; k++) { finger('pointermove', { clientX: a.clientX + ((b.clientX - a.clientX) * k) / n, clientY: a.clientY + ((b.clientY - a.clientY) * k) / n }); await wait(4); }
        finger('pointerup', verb === 'swipe' ? b : a);
      } else if (verb === 'fdown') {
        const [x, y] = arg.split(',').map(Number);
        held = at(x, y);
        finger('pointerdown', held);
        showFinger(held);
      } else if (verb === 'fmove' && held) {
        const [x, y] = arg.split(',').map(Number);
        const a = held, b = at(x, y), n = Math.max(1, Math.ceil(Math.hypot(b.clientX - a.clientX, b.clientY - a.clientY) / 8));
        for (let k = 1; k <= n; k++) { finger('pointermove', { clientX: a.clientX + ((b.clientX - a.clientX) * k) / n, clientY: a.clientY + ((b.clientY - a.clientY) * k) / n }); await wait(4); }
        held = b;
        showFinger(held);
      } else if (verb === 'pick') {
        const el = doc.querySelector(`.bb-btn[data-k="${arg}"]`);
        if (el) { for (const t of ['pointerdown', 'pointerup']) el.dispatchEvent(new win.PointerEvent(t, { pointerType: 'touch', bubbles: true })); el.click(); } else log('no button ' + arg);
      } else if (verb === 'js') {
        win.eval(arg);
      } else if (verb === 'build') {
        const [k, x, y, d = 0] = arg.split(',');
        const s = win.__game.session;
        s.state.players[s.me].cash += 1000;
        s.send({ c: 'place', k, x: Number(x), y: Number(y), d: Number(d) });
      }
      else if (verb === 'hover' || verb === 'tile') {
        const [x, y] = arg.split(',').map(Number);
        mouse('pointermove', x, y);
        if (verb === 'tile') { mouse('pointerdown', x, y); mouse('pointerup', x, y); }
      }
      await wait(120);
    }
  });
</script>
</body>
</html>
